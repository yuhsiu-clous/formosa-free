<title>認識日月潭 Welcome to Sun Moon Lake｜福爾摩沙小導遊</title>
<style>
:root{
  --sky:#E6F6FF; --ink:#16324F; --muted:#5A6B7F; --paper:#FFFFFF; --line:#CFE6F5;
  --sun:#FFC531; --leaf:#2FBF71; --coral:#FF6B6B; --ok:#1FAF66; --bad:#EF4E5A; --c:#2F9BEA;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 依需求：遊戲畫面一律維持明亮配色 */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#DDF1FD; } }
:root[data-theme="dark"]{ --sky:#DDF1FD; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;line-height:1.55}
.en{font-family:'Baloo 2','Noto Sans TC',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 14px 40px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 0;background:var(--sky)}
.bar .ttl{flex:1;min-width:0;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.ib{border:0;background:var(--paper);border-radius:14px;padding:8px 11px;font-size:15px;font-weight:700;
  box-shadow:0 3px 0 var(--line);white-space:nowrap}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* name */
.namebox{min-height:88vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.logo{font-size:72px;line-height:1}
.namebox h1{margin:0;font-size:30px;font-weight:900}
.namebox .en{font-size:20px;color:var(--c);font-weight:800;margin-top:-10px}
.namebox input{font:inherit;font-size:22px;text-align:center;padding:14px;border-radius:18px;border:3px solid var(--line);background:#fff;width:100%}
.note{font-size:13px;color:var(--muted)}

.btn{border:0;border-radius:18px;padding:13px 18px;font-size:17px;font-weight:800;background:#fff;box-shadow:0 4px 0 var(--line)}
.btn.pri{background:var(--sun);box-shadow:0 4px 0 #D9A200}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* home */
.hello{margin:6px 0 16px}
.hello h1{font-size:28px;font-weight:900;margin:0;line-height:1.2}
.hello p{margin:4px 0 0;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border:0;text-align:left;background:#fff;border-radius:22px;padding:14px;position:relative;
  box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 55%,#fff);border-top:8px solid var(--tc)}
.tcard .ico{font-size:46px;line-height:1.1}
.tcard b{display:block;font-size:18px;font-weight:900;margin-top:4px}
.tcard .en{display:block;font-size:14px;color:var(--muted);line-height:1.2}
.pbar{height:8px;background:#EEF4F8;border-radius:9px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--tc,var(--c));border-radius:9px}
.tcard .medal{position:absolute;right:10px;top:8px;font-size:26px}
.tcard:active{transform:translateY(3px)}
.tcard.wide{grid-column:1/-1}

/* topic page */
.intro{background:#fff;border-radius:20px;padding:14px 16px;margin:4px 0 14px;border-left:8px solid var(--c)}
.intro p{margin:4px 0}
.say{border:0;background:color-mix(in srgb,var(--c) 18%,#fff);border-radius:999px;padding:3px 9px;font-size:15px;vertical-align:middle}
.say:active{transform:scale(.92)}
.maptitle{font-weight:900;font-size:18px;margin:8px 0 6px}
.maptitle span{font-weight:500;font-size:13px;color:var(--muted)}
.map{position:relative;width:100%;border-radius:26px;overflow:hidden;
  background:linear-gradient(#BFE9FF 0%,#E2F7FF 14%,#C9F2B5 15%,#A9E79A 100%)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;font-size:30px;pointer-events:none}
.stop{position:absolute;transform:translate(-50%,-50%);border:0;background:none;display:flex;flex-direction:column;align-items:center;width:46%}
.stop .ring{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:32px;
  border:5px solid #fff;box-shadow:0 5px 0 rgba(22,50,79,.18);position:relative}
.stop.done .ring{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.stop .ok{position:absolute;right:-8px;top:-8px;background:var(--ok);color:#fff;border-radius:50%;width:26px;height:26px;
  font-size:15px;display:grid;place-items:center;border:3px solid #fff}
.stop .lb{white-space:nowrap;margin-top:4px;background:#fff;border-radius:12px;padding:2px 8px;font-weight:900;font-size:13px;line-height:1.3;text-align:center;box-shadow:0 2px 0 rgba(22,50,79,.12)}
.stop .lb .en{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.stop:active .ring{transform:scale(.94)}
.cert{background:#fff;border-radius:24px;padding:18px;text-align:center;margin:0 0 14px;
  border:4px dashed var(--c);position:relative}
.cert .m{font-size:56px;line-height:1}
.cert .nm{font-size:30px;font-weight:900;margin:2px 0}
.cert .en{color:var(--muted)}
.cert .dt{font-size:13px;color:var(--muted);margin-top:6px}
.hint2{font-size:13px;color:var(--muted);text-align:center;margin:8px 0}

/* learn */
.lcard{background:#fff;border-radius:26px;padding:18px;text-align:center;border-bottom:7px solid var(--c)}
.lcard .big{font-size:96px;line-height:1.15}
.word{font-size:26px;font-weight:800;line-height:1.15}
.zhw{font-size:24px;font-weight:900;margin:4px 0 8px}
.desc{text-align:left;background:color-mix(in srgb,var(--c) 9%,#fff);border-radius:16px;padding:10px 13px}
.desc p{margin:5px 0}
.desc .en{font-size:17px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.navrow span{font-weight:800;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:#C9DCEB}
.dots i.on{background:var(--c)}

/* quiz */
.qhead{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);margin:2px 0 8px}
.qbox{background:#fff;border-radius:22px;padding:16px;text-align:center}
.qbox .big{font-size:80px;line-height:1.1}
.qbox .q{font-size:17px}
.qbox .ask{font-weight:900;margin-top:8px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:11px 12px;text-align:left;font-size:16px;font-weight:700}
.opt.good{border-color:var(--ok);background:#E5F8EE}
.opt.wrong{border-color:var(--bad);background:#FDECEE}
.fb{margin-top:12px;background:#fff;border-radius:16px;padding:12px;text-align:center;font-weight:700}

/* match-3 */
.stat{display:flex;justify-content:space-between;gap:6px;background:#fff;border-radius:16px;padding:8px 12px;font-weight:700}
.stat b{font-size:20px;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:0;background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:color-mix(in srgb,var(--c) 22%,#fff);
  padding:6px;border-radius:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:min(8.2vw,40px);line-height:1}
.cell.sel{outline:4px solid var(--sun);transform:scale(1.06)}
.cell.hint{animation:pulse .7s ease-in-out infinite alternate;background:#FFF4C9}
.cell.pop{animation:pop .28s forwards}
.cell.drop{animation:drop .26s ease-out}
.cell.shake{animation:shake .3s}
@keyframes pulse{to{transform:scale(1.13);box-shadow:0 0 0 4px var(--sun)}}
@keyframes pop{to{transform:scale(0);opacity:0}}
@keyframes drop{from{transform:translateY(-60%);opacity:.2}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);opacity:0;
  background:#fff;border-radius:18px;padding:10px 16px;font-weight:800;font-size:17px;box-shadow:0 6px 0 rgba(22,50,79,.15);
  transition:.25s;z-index:40;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}

/* collect */
.target{background:#fff;border-radius:18px;padding:10px 14px;margin:10px 0;text-align:center;border:3px solid var(--c)}
.target .lbl{font-size:13px;color:var(--muted);display:block}
.target .en{font-size:22px;font-weight:800}
.target .zs{font-size:15px;font-weight:700;color:var(--muted)}
.arena{position:relative;height:52vh;min-height:300px;border-radius:22px;overflow:hidden;touch-action:manipulation;
  background:linear-gradient(#DDF3FF,#F4FBFF 70%,#E3F7D8)}
.fall{position:absolute;left:0;top:0;width:66px;height:66px;border:0;border-radius:50%;background:rgba(255,255,255,.9);
  font-size:40px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(22,50,79,.15);padding:0}
.fall.wrong{background:#FDDDE0}
.float{position:absolute;font-weight:900;font-size:15px;pointer-events:none;animation:up .9s forwards;white-space:nowrap;
  background:#fff;padding:2px 8px;border-radius:10px}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.basket{margin-top:10px;background:#fff;border-radius:18px;min-height:56px;padding:8px 12px;font-size:30px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.basket .lb{font-size:14px;font-weight:800;color:var(--muted);margin-right:6px}

/* pairs */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.pc{aspect-ratio:3/3.4;border:0;border-radius:16px;background:var(--c);color:#fff;font-size:34px;font-weight:900;padding:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(22,50,79,.18);transition:transform .15s}
.pc.up{background:#fff;color:var(--ink)}
.pc.got{background:#E5F8EE;color:var(--ink);box-shadow:0 0 0 3px var(--ok) inset}
.pc .e{font-size:34px;line-height:1.1}
.pc .t{font-size:14px;line-height:1.2;font-weight:800;margin-top:4px}
.pc .tz{font-size:20px;font-weight:900;line-height:1.25}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(22,50,79,.35);display:grid;place-items:center;z-index:50;padding:18px}
.modal{background:#fff;border-radius:28px;padding:22px;max-width:420px;width:100%;text-align:center}
.modal .e{font-size:64px;line-height:1}
.modal h2{margin:6px 0;font-size:24px;font-weight:900}
.modal .btns{display:grid;gap:10px;margin-top:14px}
.cheer{background:#FFF4C9;border-radius:14px;padding:8px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px}
.tag{background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700}
.fest{font-weight:800;margin:-2px 0 10px;color:var(--c)}
.objs{text-align:left;margin-top:12px;border-top:3px dotted color-mix(in srgb,var(--c) 30%,#fff);padding-top:10px}
.otitle{font-weight:900;margin-bottom:6px}
.orow{display:flex;gap:10px;align-items:flex-start;padding:8px 0}

.oe{font-size:40px;line-height:1;width:48px;text-align:center;flex:none}

.word.sm{font-size:20px}
.big2{font-size:20px;font-weight:800}
.tribes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}

.play{border:0;border-radius:20px;padding:16px 22px;font-size:22px;font-weight:900;background:var(--sun);box-shadow:0 4px 0 #D9A200}

.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:9px;margin-top:12px}
.bin{border:3px dashed color-mix(in srgb,var(--c) 45%,#fff);background:#fff;border-radius:18px;padding:12px 6px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px}

.lhead,.lnav{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:4px 0 8px}
.lhead b{font-size:20px}.lhead span,.lnav span{color:var(--muted);font-size:14px}
.btn.sm{padding:8px 13px;font-size:15px}

.ltile{position:relative;border:0;background:#fff;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.25;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 25%,#fff)}
.ltile .e{font-size:40px;line-height:1.2}.ltile b{font-size:14px}.ltile .en{font-size:11px;color:var(--muted)}

#lc{touch-action:pan-y;user-select:none;-webkit-user-select:none}

.cdemo{display:flex;flex-direction:column;gap:12px}

.cexh{font-weight:700;color:#B7791F;margin-bottom:6px}

.ctg .lbl{color:#6b7c85;font-size:14px}.ctg .zs{font-size:13px;color:#6b7c85}
.car{position:relative;height:190px;margin-top:8px;border-radius:14px;background:linear-gradient(180deg,#E8F6FF,#F6FBFF);overflow:hidden}
.cf{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px}
.cf .ce{font-size:42px;line-height:1;width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}

.tlask{font-size:14px;margin:2px 2px 6px}

{id:"sunmoon",zh:"認識日月潭",en:"Welcome to Sun Moon Lake",icon:"🌗",color:"#138A97",levels:STD,
 intro:["Sun Moon Lake is the largest body of inland water in Taiwan, 748 meters above sea level in Nantou. The Sun Lake is in the northeast, the Moon Lake is in the southwest, and Lalu Island, the sacred center of the Thao people, is in the middle.","日月潭是全臺灣最大的內陸水域，位在南投、海拔 748 公尺。東北是日潭、西南是月潭，中間是邵族的聖地拉魯島——「日、月、島」一句話就說完整座潭的地理！"],
 sortTitle:"它在日月潭的哪一區？ Which area is it in?",
 cats:[
  {id:"shuishe",e:"⛴️",zh:"水社・向山",en:"Shuishe & Xiangshan"},
  {id:"wenwu",e:WENWU,zh:"北岸文武廟",en:"Wenwu Temple"},
  {id:"lake",e:"💧",zh:"潭水與拉魯島",en:"The lake & Lalu Island"},

 items:[
 {e:"⛴️",en:"Shuishe Pier",zh:"水社碼頭",c:"shuishe",p:"shuishe",sp:"pier",d:"The main gateway and the busiest pier on the lake. Almost every bus, ferry ticket and hotel check-in passes through here.",dz:"潭區的主要門戶，也是最繁忙的碼頭；幾乎所有客運、船票與住宿報到都在這裡完成。"},
 {e:"🚶",en:"Lakeside walkway",zh:"親水步道",c:"shuishe",p:["meihe","sdam"],sp:"walkway",d:"From Shuishe Pier it runs west to Meihe Garden and the Shuishe Dam. It is flat and shaded, good for slow walkers. Allow forty minutes with stops.",dz:"從水社碼頭向西通往梅荷園與水社壩；平緩多蔭，適合行動不便的訪客。含解說停留約四十分鐘。"},
 {e:XIANGSHAN,en:"Xiangshan Visitor Center",zh:"向山遊客中心",c:"shuishe",p:"xiangshan",sp:"architect",d:"Opened in 2011 and designed by the Japanese architect Norihiko Dan. Two curving concrete wings frame the lake like a picture. It is free, with clean restrooms.",dz:"2011 年啟用，由日本建築師團紀彥設計；兩道弧形清水混凝土量體把湖景框成一幅畫。免費參觀、廁所整潔。"},
 {e:"🔭",en:"Xiangshan Sky Deck",zh:"向山眺望平台",c:"shuishe",p:"xiangshan",sp:"deck",d:"A cantilever platform that reaches about 30 meters out over the water.",dz:"懸臂式的眺望平台，向水面延伸約 30 公尺。"},
 {e:"🚲",en:"Water-level bikeway",zh:"水上自行車道",c:"shuishe",p:"bikeway",sp:"boardwalk",d:"The 4-kilometer stretch from Shuishe to Xiangshan floats on a boardwalk just above the water. In 2012 CNNGo listed the lake's bikeway among the ten most beautiful in the world.",dz:"水社到向山約 4 公里，木棧道幾乎貼著水面。2012 年 CNNGo 把日月潭自行車道列入全球十大最美單車路線。"},
 {e:"🛥️",en:"Ferry triangle",zh:"三碼頭遊艇",c:"shuishe",p:["shuishe","xuanguang","itathao"],sp:"ferry",d:"Scheduled ferries link three piers: Shuishe, Xuanguang and Ita Thao. One ticket normally lets you hop on and off all day.",dz:"定期遊艇串聯水社、玄光、伊達邵三座碼頭；一張船票通常可在當天不限次數搭乘。"},
 {e:WENWU,en:"Wenwu Temple",zh:"文武廟",c:"wenwu",p:"wenwu",sp:"temple",d:"It worships civil and martial gods under one roof. It was rebuilt in 1969, after the rising water covered two older temples, in a northern palace style with red columns and yellow tiles.",dz:"同時奉祀文、武神祇；因水位上升淹沒兩座舊廟，1969 年以北方宮殿式重建，紅柱黃瓦。"},
 {e:"📜",en:"Confucius",zh:"孔子",c:"wenwu",p:"wenwu",sp:"teacher",d:"The civil god — the teacher. He is in the rear hall of Wenwu Temple. Wen means civil.",dz:"文的代表、至聖先師，供奉在文武廟後殿；「文」就是文治。"},
 {e:"⚔️",en:"Guan Gong and Yue Fei",zh:"關公與岳飛",c:"wenwu",p:"wenwu",sp:"warriors",d:"The martial gods — the warriors. They stand in the front. Wu means martial, so the temple is called Wenwu.",dz:"武的代表，兩位武將供奉在前殿；「武」就是武功，所以叫「文武廟」。"},
 {e:STEPS,en:"Year Steps",zh:"年梯步道",c:"wenwu",p:"wenwu",sp:"steps",d:"366 steps, one for every day of a leap year. Find your birthday and tie a bell with a wish. They are new — from 2003.",dz:"共 366 階，對應閏年的每一天；找到自己的生日、繫上祈福鈴。這是 2003 年的新設計。"},
 {e:STONELION,en:"Stone lions",zh:"石獅",c:"wenwu",p:"wenwu",sp:"lions",d:"Two stone lions at the entrance, about 8 meters tall, donated in 1981. They are a good photo instead of the god statues.",dz:"門前兩尊石獅高約 8 公尺，1981 年捐贈；可以拍石獅，取代正面拍神像。"},
 {e:"🚪",en:"Dragon door and tiger door",zh:"龍門與虎門",c:"wenwu",p:"wenwu",sp:"threshold",d:"Three temple rules: step over the threshold, go in by the dragon door on the right, and come out by the tiger door on the left.",dz:"入廟三原則：跨過門檻、由右側龍門入、由左側虎門出。"},
 {e:SUNLAKE,en:"Sun Lake",zh:"日潭",c:"lake",p:"sunlake",sp:"basin",d:"The rounded basin in the northeast of the lake looks like the sun.",dz:"東北側渾圓的水域，形狀像太陽。"},
 {e:MOONLAKE,en:"Moon Lake",zh:"月潭",c:"lake",p:"moonlake",sp:"crescent",d:"The slender crescent in the southwest looks like a new moon.",dz:"西南側細長的水域，像一彎新月。"},
 {e:LALU,en:"Lalu Island",zh:"拉魯島",c:"lake",p:"lalu",sp:null,d:"The sacred center of the Thao and home of their highest ancestral spirit. The 1999 earthquake made it much smaller. No one may land there.",dz:"邵族的聖地、最高祖靈的居所；1999 年地震後大幅縮小，今日禁止任何人登島。"},
 {e:"⚡",en:"Hydroelectric scheme",zh:"水力發電工程",c:"lake",p:"sunlake",nogeo:true,sp:"reservoir",d:"Work began in 1919 under Japanese rule. It raised the water about 18 meters and joined two smaller lakes into one. The lake is a working reservoir.",dz:"1919 年日治時期開工，水位抬高約 18 公尺，兩處水域合而為一；日月潭其實是一座運轉中的水庫。"},
 {e:TUNNEL,en:"Water tunnel",zh:"引水隧道",c:"lake",p:"wujie",sp:"tunnel",d:"Water from the Zhuoshui River is taken at Wujie Dam and carried more than 15 kilometers through a mountain tunnel into the lake.",dz:"濁水溪的水在武界壩攔下，經長逾 15 公里的越嶺隧道送進潭中。"},
 {e:"🔋",en:"Pumped storage",zh:"抽蓄發電",c:"lake",p:"sunlake",nogeo:true,sp:"storage",d:"At night, cheap electricity pumps water uphill. At peak hours the water falls again and makes power in minutes. Mingtan alone has 1,602 megawatts.",dz:"夜間用離峰電力把水抽上去，尖峰時段放水，幾分鐘內就能發電；光是明潭電廠就有 1,602 百萬瓦。"},
 {e:"🛁",en:"Bathtub ring",zh:"水位痕",c:"lake",p:"sunlake",nogeo:true,sp:"ring",d:"When the water is low, a ring of bare shore appears. It is not a drought — the lake is doing its job. The normal level is 748.48 meters.",dz:"水位低時岸邊會露出一圈水位痕；這不是乾旱，而是潭水正在發電。正常運轉水位是 748.48 公尺。"},
 {e:"🏊",en:"Swimming Carnival",zh:"萬人泳渡",c:"lake",p:"sunlake",nogeo:true,sp:"swimming",d:"Every September since 1983, more than 20,000 swimmers cross about 3.3 kilometers of the lake. It is Taiwan's largest open-water event.",dz:"自 1983 年起每年九月舉辦，逾 2 萬人橫渡約 3.3 公里，是臺灣規模最大的開放水域活動。"},
 {e:"🐟",en:"President fish",zh:"總統魚",c:"lake",p:"sunlake",nogeo:true,sp:"fish",d:"A local fish (the izumi goby) that got its nickname because Chiang Kai-shek liked to eat it. Its taste word is sweetness.",dz:"曲腰魚，因蔣中正喜歡吃而得名「總統魚」；它的味覺關鍵字是「鮮甜」。"},
 {e:MARKER,en:"Xuanguang Temple",zh:"玄光寺",c:"south",p:"xuanguang",sp:"marker",d:"A small temple right on the water, the only temple with its own ferry stop. The photo at its stone marker may be the most famous picture of the lake.",dz:"緊臨水邊的小寺，是唯一有遊艇直接停靠的寺廟；石碑前的那張照片，可能是全世界流傳最廣的日月潭影像。"},
 {e:TEAEGG,en:"Tea eggs",zh:"阿婆茶葉蛋",c:"south",p:"xuanguang",sp:"eggs",d:"A local woman has sold eggs simmered in shiitake and tea here since the 1980s. Describe the smell, not just the price!",dz:"在地阿婆從 1980 年代賣到現在，用香菇和茶葉滷煮；請描述香氣，而不只是報價格！"},
 {e:"📿",en:"Xuanzang Temple",zh:"玄奘寺",c:"south",p:"xuanzang",sp:"relic",d:"It keeps a relic of Xuanzang, the Tang dynasty monk who brought Buddhist scriptures back from India. The relic came to Taiwan in 1965.",dz:"奉有唐代高僧玄奘的靈骨——他曾遠赴印度取回佛經；靈骨於 1965 年迎回臺灣。"},
 {e:PAGODA,en:"Ci'en Pagoda",zh:"慈恩塔",c:"south",p:"cien",sp:"pagoda",d:"Finished in 1971. Chiang Kai-shek built it in memory of his mother. It is 46 meters high, and its tip is exactly 1,000 meters above sea level.",dz:"1971 年落成，蔣中正為紀念母親而建；塔高 46 公尺，塔尖恰好位在海拔 1,000 公尺。"},
 {e:"🔔",en:"Memorial bell",zh:"紀念銅鐘",c:"south",p:"cien",sp:"bell",d:"One bronze bell hangs at the top of the pagoda. Ring it once, gently — it is a memorial bell, not a photo prop.",dz:"塔頂涼亭懸著一口銅鐘；每人輕敲一次就好，它是紀念之鐘，不是拍照道具。"},
 {e:"🥾",en:"Pagoda trail",zh:"慈恩塔步道",c:"south",p:"cien",sp:"uphill",d:"About 700 meters uphill from the Xuanzang Temple side, 20 to 25 minutes. There is no shop on the trail, so bring water.",dz:"自玄奘寺方向上坡約 700 公尺，約需 20 到 25 分鐘；沿途沒有商店，記得帶水。"},

 {e:"🧺",en:"Ancestral basket",zh:"公媽籃",c:"ita",p:"itathao",nogeo:true,sp:"basket",d:"The ulalaluan is a basket of ancestral clothing kept in the home of each priestess. It is the center of Thao ritual.",dz:"公媽籃（ulalaluan）裝著祖先的衣飾，供奉在每位先生媽家中，是邵族祭儀的核心。"},

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const catOf=(t,id)=>t.cats.find(c=>c.id===id);
function pickOpts(t,it,n=4){const others=shuffle(t.items.filter(x=>x!==it&&(!it.grp||x.grp!==it.grp)));
  const res=[];const seen=new Set([it.grp]);for(const o of others){if(res.length>=n-1)break;if(t.ind&&seen.has(o.grp))continue;seen.add(o.grp);res.push(o)}
  for(const o of others){if(res.length>=n-1)break;if(!res.includes(o))res.push(o)}return shuffle([it,...res])}

const S={name:null,prog:{}};
function load(){try{S.name=localStorage.getItem("fg1_sunmoon_name");S.prog=JSON.parse(localStorage.getItem("fg1_sunmoon_prog")||"{}")||{}}catch(e){}}
function save(){try{localStorage.setItem("fg1_sunmoon_prog",JSON.stringify(S.prog))}catch(e){}}
const isDone=(t,l)=>!!(S.prog[t]&&S.prog[t][l]);
const BONUS=["speak"];/* 加分題：不計入完成總數 */const reqLv=t=>T(t).levels.filter(l=>!BONUS.includes(l));
const allDone=t=>reqLv(t).every(l=>isDone(t,l));
const count=t=>reqLv(t).filter(l=>isDone(t,l)).length;
function mark(t,l){S.prog[t]=S.prog[t]||{};if(!S.prog[t][l])S.prog[t][l]=Date.now();if(allDone(t)&&!S.prog[t]._all)S.prog[t]._all=Date.now();save()}
let cleanups=[];
function clean(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];try{speechSynthesis.cancel()}catch(e){}}
function later(fn,ms){const id=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(id));return id}
const wait=ms=>new Promise(r=>later(r,ms));
function speak(txt,rate){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=rate||.88;
  const vs=s.getVoices();const v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;s.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}
const say=txt=>`<button class="say" data-say="${esc(txt)}" aria-label="播放英文發音">🔊</button>`;
function toast(html,ms=1500){const el=$("#toast");el.innerHTML=html;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),ms)}
function setHash(h){try{history.replaceState(null,"",location.pathname+location.search+(h?"#"+h:""))}catch(e){}}
function bar(title,sub,topic){return `<div class="bar"><button class="ib" data-go="home" aria-label="回遊戲首頁">🏠 遊戲首頁</button>
 <a class="ib catb" href="/index.html" target="_blank" rel="noopener" aria-label="回總目錄">📚 總目錄</a>
 <div class="ttl">${title}${sub?`<small class="en">${sub}</small>`:""}</div></div>`}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]");if(s){e.preventDefault();speak(s.dataset.say,s.dataset.slow?.6:0);return}
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go)}});
function go(r){clean();document.querySelectorAll(".overlay").forEach(o=>o.remove());window.scrollTo(0,0);
  const p=r.split(":");if(p[0]==="home")showHome();else if(p[0]==="topic")showTopic(p[1]);else if(p[0]==="level")playLevel(p[1],p[2])}

/* ---------- 主題頁＋成就地圖 ---------- */
function stopsFor(N){return Array.from({length:N},(_,i)=>[i%2?72:28,5+(i+.6)*(84/N)])}
function mapHTML(t){const N=t.levels.length,H=N*190+120,P=stopsFor(N).map(([x,y])=>[x,y*(N*190)/H]),pts=P.map(([x,y])=>[x*10,y*H/100]);const C=t.color;
  let d=`M${pts[0][0]},40`;pts.forEach((p,i)=>{const q=i?pts[i-1]:[pts[0][0],40];d+=` C${q[0]},${(q[1]+p[1])/2} ${p[0]},${(q[1]+p[1])/2} ${p[0]},${p[1]}`});
  const last=pts[N-1],gx=500,gy=H-70;d+=` C${last[0]},${(last[1]+gy)/2} ${gx},${(last[1]+gy)/2} ${gx},${gy}`;
  let gold='';for(let i=1;i<N;i++){if(isDone(t.id,t.levels[i-1])&&isDone(t.id,t.levels[i])){const q=pts[i-1],p=pts[i];gold+=`<path d="M${q[0]},${q[1]} C${q[0]},${(q[1]+p[1])/2} ${p[0]},${(q[1]+p[1])/2} ${p[0]},${p[1]}" fill="none" stroke="#F7C948" stroke-width="16" stroke-linecap="round"/>`}}
  let hills='';const sh=['#BFE6A8','#A8DB92','#9AD285','#B4E09C'];for(let y=150,k=0;y<H;y+=300,k++){const a=40+(k%3)*25;hills+=`<path d="M0,${y} C200,${y-a} 380,${y+a} 560,${y-a*.6} C740,${y-a*1.4} 880,${y+a*.4} 1000,${y-a*.3} L1000,${H} L0,${H} Z" fill="${sh[k%4]}"/><path d="M0,${y} C200,${y-a} 380,${y+a} 560,${y-a*.6} C740,${y-a*1.4} 880,${y+a*.4} 1000,${y-a*.3} L1000,${H} L0,${H} Z" fill="${C}" opacity=".06"/>`}
  const tree=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-5" y="0" width="10" height="26" fill="#8A5A3B"/><circle cx="0" cy="-8" r="24" fill="#4E9A3A"/><circle cx="-12" cy="2" r="16" fill="#5DB046"/><circle cx="13" cy="0" r="17" fill="#3F8A30"/><circle cx="-6" cy="-14" r="7" fill="#7CC765" opacity=".8"/></g>`;
  const pine=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-4" y="10" width="8" height="16" fill="#7A4E2E"/><path d="M0,-40 L22,-6 L12,-6 L28,14 L-28,14 L-12,-6 L-22,-6 Z" fill="#2F7D4A"/><path d="M0,-40 L10,-24 L0,-20 Z" fill="#4FA36A"/></g>`;
  const house=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-26" y="-14" width="52" height="34" fill="#FFF3DA" stroke="#C99A5A" stroke-width="2"/><path d="M-34,-12 L0,-40 L34,-12 Z" fill="${C}"/><rect x="-7" y="2" width="14" height="18" fill="#9B6A3F"/><rect x="12" y="-6" width="10" height="10" fill="#BFE5F2" stroke="#C99A5A" stroke-width="1.5"/></g>`;
  const flowers=(x,y)=>[0,1,2,3].map(i=>`<g transform="translate(${x+i*16-24},${y+(i%2)*8})"><line x1="0" y1="0" x2="0" y2="12" stroke="#4E9A3A" stroke-width="2"/><circle r="5" fill="${['#FF8FA3','#FFD54A','#FFFFFF','#C49BFF'][i]}"/><circle r="2" fill="#F59E0B"/></g>`).join('');
  const rock=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="22" ry="12" fill="#B9BFC4"/><ellipse cx="${x-6}" cy="${y-4}" rx="9" ry="4" fill="#D5DADE"/>`;
  const KIT=[tree,pine,house,tree,pine];let scen='';
  P.forEach(([x,y],i)=>{const yy=y*H/100,side=x>50?[90,175]:[825,910];const f=KIT[i%KIT.length];scen+=f(side[0],yy-10,1)+f(side[1],yy+38,.75)+(i%2?flowers(x>50?140:860,yy+90):rock(x>50?150:850,yy+92))});
  const sky=`<rect width="1000" height="${H}" fill="url(#tg)"/><rect width="1000" height="170" fill="url(#ts)"/><circle cx="890" cy="70" r="40" fill="#FFE27A"/><circle cx="890" cy="70" r="56" fill="#FFE27A" opacity=".3"/>`+[[150,60,1],[420,90,.8],[700,50,.9]].map(([x,y,s])=>`<g transform="translate(${x},${y}) scale(${s})" fill="#fff" opacity=".95"><ellipse cx="0" cy="0" rx="46" ry="20"/><ellipse cx="-28" cy="8" rx="30" ry="15"/><ellipse cx="30" cy="8" rx="34" ry="16"/></g>`).join('');
  const sign=`<g transform="translate(${pts[0][0]>500?pts[0][0]-150:pts[0][0]+150},70)"><rect x="-5" y="-4" width="10" height="70" fill="#8A5A3B"/><rect x="-78" y="-24" width="156" height="44" rx="8" fill="#C98A4B" stroke="#8A5A3B" stroke-width="4"/><text y="6" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" font-family="sans-serif">出發 START</text></g>`;
  const all=allDone(t.id);
  const castle=`<g transform="translate(${gx},${gy})"><rect x="-90" y="-50" width="180" height="70" fill="#F4E7CF" stroke="#B08A55" stroke-width="4"/><rect x="-110" y="-90" width="44" height="110" fill="#EADBBE" stroke="#B08A55" stroke-width="4"/><rect x="66" y="-90" width="44" height="110" fill="#EADBBE" stroke="#B08A55" stroke-width="4"/>${[-110,-99,-88,-77,66,77,88,99].map(x=>`<rect x="${x}" y="-102" width="8" height="12" fill="#EADBBE" stroke="#B08A55" stroke-width="2"/>`).join('')}<path d="M-22,20 L-22,-12 Q0,-34 22,-12 L22,20 Z" fill="#8A5A3B"/><line x1="-88" y1="-90" x2="-88" y2="-150" stroke="#6B4A22" stroke-width="4"/><path d="M-88,-150 L-48,-138 L-88,-126 Z" fill="${C}"/><line x1="88" y1="-90" x2="88" y2="-150" stroke="#6B4A22" stroke-width="4"/><path d="M88,-150 L128,-138 L88,-126 Z" fill="${C}"/><rect x="-70" y="-84" width="140" height="30" rx="6" fill="${C}"/><text y="-62" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="sans-serif">${all?'🏆 全部過關':'終點 GOAL'}</text></g>`;
  const nxt=t.levels.findIndex(l=>!isDone(t.id,l));
  return `<div class="map tmap2" style="aspect-ratio:1000/${H}">
   <svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7F1C8"/><stop offset="1" stop-color="#B7E3A3"/></linearGradient><linearGradient id="ts" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FDDF7"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></linearGradient></defs>
    ${sky}${hills}${scen}${sign}
    <path d="${d}" fill="none" stroke="#C9A86A" stroke-width="70" stroke-linecap="round" opacity=".55"/><path d="${d}" fill="none" stroke="#F3E3BC" stroke-width="58" stroke-linecap="round"/>${gold}
    <path d="${d}" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="22 20" stroke-linecap="round" opacity=".9"/>${castle}</svg>
   ${t.levels.map((l,i)=>{const dn=isDone(t.id,l);return `<button class="stop ${dn?"done":""} ${i===nxt?"next":""}" style="left:${P[i][0]}%;top:${P[i][1]}%" data-go="level:${t.id}:${l}">
     <span class="ring"><span class="num">${i+1}</span>${LV[l].icon}${dn?'<span class="ok">★</span>':""}${i===nxt?'<span class="nx">▶ 下一關</span>':""}</span><span class="lb">${lvName(t,l)}<span class="en">${lvEn(t,l)}</span></span></button>`}).join("")}</div>`}
function showTopic(id){const t=T(id);if(!t)return showHome();setHash(id);document.documentElement.style.setProperty("--c",t.color);
  const all=allDone(id),n=t.levels.length;const dt=all&&S.prog[id]._all?new Date(S.prog[id]._all).toLocaleDateString("zh-TW"):"";
  app.innerHTML=bar(`${t.icon} ${t.zh}`,t.en)+
   (all?`<div class="cert"><div class="m">🏅</div><div><b>成就證書</b> <span class="en">Certificate</span></div><div class="nm">${esc(S.name)}</div>
     <div>完成「${t.zh}」全部 ${n} 關！</div><div class="en">All ${n} levels of ${t.en} cleared!</div><div class="dt">${dt}</div></div>`:"")+
   `<div class="intro"><p class="en">${t.intro[0]} ${say(t.intro[0])}</p><p>${t.intro[1]}</p></div>`+
   (t.ind?`<div class="maptitle">🪶 17 族一覽 <span>點一下聽英文族名</span></div><div class="tribes">${t.items.map(x=>`<button class="tribe" data-say="${esc(x.en)}"><span>${x.e}</span><b>${x.zh}</b><span class="en">${x.en}</span></button>`).join("")}</div>`:"")+
   `<div class="maptitle">🗺️ ${esc(S.name)} 的成就地圖 <span>${count(id)} / ${n} 關</span></div>${mapHTML(t)}
   <p class="hint2">點地圖上的關卡圖示，就能直接進入遊戲。${all?"記得截圖保存你的成就證書！":"建議從第 1 關「認識圖鑑」開始。"}</p>`;
}

/* ---------- 關卡框架 ---------- */
function playLevel(tid,lv){const t=T(tid);if(!t||!LV[lv])return showHome();setHash(tid);document.documentElement.style.setProperty("--c",t.color);
  app.innerHTML=bar(`${LV[lv].icon} ${lvName(t,lv)}`,`${t.zh}｜${lvEn(t,lv)}`,tid)+'<div id="body"></div>';
  ({tpmap:lvTpMap,numbers:lvNumbers,group:lvGroup,mrt:lvMrt,plan:lvPlan,geo:lvGeo,learn:lvLearn,quiz:lvQuiz,listen:lvListen,spell:lvSpell,tf:lvTF,sort:lvSort,timeline:lvTimeline,detective:lvDetective,artifact:lvArtifact,match3:lvMatch3,collect:lvCollect,pairs:lvPairs})[lv](t,$("#body"));
}
function finishLevel(t,lv,ok,msg){const was=allDone(t.id);if(ok)mark(t.id,lv);const now=allDone(t.id);
  const i=t.levels.indexOf(lv);const nx=t.levels.slice(i+1).find(l=>!isDone(t.id,l))||t.levels.find(l=>!isDone(t.id,l))||t.levels[i+1];
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="modal"><div class="e">${ok?"🎉":"💪"}</div><h2>${ok?"過關！":"再試一次！"}<br><span class="en">${ok?"Level clear!":"Try again!"}</span></h2><p>${msg}</p>
   ${ok&&now&&!was?'<p class="cheer">🏅 全部關卡完成！成就證書已解鎖！</p>':""}
   <div class="btns">${ok&&nx&&!now?`<button class="btn pri" data-go="level:${t.id}:${nx}">下一關：${lvName(t,nx)} ▶</button>`:""}
   <button class="btn ${now||!ok?"pri":""}" data-go="topic:${t.id}">🗺️ ${now?"看成就證書":"回成就地圖"}</button>
   <button class="btn" data-go="level:${t.id}:${lv}">🔁 再玩一次</button></div></div>`;
  document.body.appendChild(ov);cleanups.push(()=>ov.remove());
}
const head=(a,b)=>`<div class="qhead"><span>${a}</span><span>${b}</span></div>`;
const nextBtn=(last,id="nq")=>`<div style="margin-top:10px"><button class="btn pri" id="${id}">${last?"看結果":"下一題 ▶"}</button></div>`;

/* 1 認識圖鑑：目錄＋左右滑動 */
function lvLearn(t,body){const n=t.items.length;const order=t.cats.flatMap(c=>t.items.map((_,i)=>i).filter(i=>t.items[i].c===c.id));S.prog[t.id]=S.prog[t.id]||{};const seen=new Set(S.prog[t.id]._seen||[]);
  const markSeen=i=>{if(!seen.has(i)){seen.add(i);S.prog[t.id]._seen=[...seen];save();
    if(seen.size===n&&!isDone(t.id,"learn"))later(()=>finishLevel(t,"learn",true,`你看完了全部 ${n} 張「${t.zh}」圖鑑！接著用遊戲來複習吧。`),700)}};
  const grid=()=>{window.scrollTo(0,0);
    body.innerHTML=`<div class="lhead"><b>📚 圖鑑目錄</b><span>已看 ${seen.size} / ${n}</span></div><div class="pbar"><i style="width:${seen.size/n*100}%"></i></div>
     <p class="note">點任何一張卡片開始看，卡片可以左右滑動換頁；全部看過就過關。</p>`+
     t.cats.map(c=>{const its=t.items.map((it,i)=>[it,i]).filter(([it])=>it.c===c.id);if(!its.length)return"";
      return `<div class="gcat">${c.e} ${c.zh} <span class="en">${c.en}</span></div><div class="lgrid">${its.map(([it,i])=>`<button class="ltile ${seen.has(i)?"seen":""}" data-i="${i}">${seen.has(i)?'<span class="ok">✓</span>':""}<span class="e">${it.e}</span><b>${it.zh}</b><span class="en">${it.en}</span></button>`).join("")}</div>`}).join("");
    body.querySelectorAll(".ltile").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;card(i);speak(t.items[i].en)})};
  const card=(i,dir)=>{const pos=order.indexOf(i),it=t.items[i],cat=catOf(t,it.c);window.scrollTo(0,0);markSeen(i);
    const tags=t.ind?`<span class="tag">📍 ${it.place}</span><span class="tag">🎉 ${it.pz}</span>`:`<span class="tag">${cat.e} ${cat.zh}</span>${it.yl?`<span class="tag">⏳ ${it.yl}</span>`:""}`;
    body.innerHTML=`<div class="lnav"><button class="btn sm" id="toc">📚 圖鑑目錄</button><span>第 ${pos+1} / ${n} 張・已看 ${seen.size}</span></div>
     <div class="lcard ${dir?"slide"+dir:""}" id="lc"><div class="big">${it.e}</div><div class="word en">${it.en} ${say2(it.en)}</div><div class="zhw">${it.zh}</div>
     <div class="tags">${tags}</div>${t.ind?`<div class="fest en">🎉 ${it.pen} ${say(it.pen)}</div>`:""}
     <div class="desc"><p class="en">${it.d} ${say2(it.d)}</p><p>${it.dz}</p></div>
     ${t.ind?`<div class="objs"><div class="otitle">🏺 代表文物與文化 <span class="en">Culture & objects</span></div>${it.obj.map(o=>`<div class="orow"><span class="oe">${o.e}</span><div><b>${o.zh}</b><br><span class="en">${o.en}</span> ${say(o.en)}<div class="ox">${o.x}</div></div></div>`).join("")}</div>`:""}</div>
     <div class="dots">${order.map(k=>`<i class="${k===i?"cur":seen.has(k)?"on":""}"></i>`).join("")}</div>
     <p class="note" style="text-align:center">👈 左右滑動卡片換頁 👉</p>
     <div class="navrow"><button class="btn" id="pv" ${pos===0?'disabled style="opacity:.4"':""}>◀ 上一張</button>
     <button class="btn pri" id="nx">${pos===n-1?"📚 回目錄":"下一張 ▶"}</button></div>`;
    const to=(p,d)=>{if(p<0||p>=n)return;const k=order[p];card(k,d);speak(t.items[k].en)};
    $("#toc").onclick=grid;$("#pv").onclick=()=>to(pos-1,"R");$("#nx").onclick=()=>pos===n-1?grid():to(pos+1,"L");
    const lc=$("#lc");let st=null;
    lc.addEventListener("pointerdown",e=>{st={x:e.clientX,y:e.clientY}});
    lc.addEventListener("pointercancel",()=>{st=null});
    lc.addEventListener("pointerup",e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;st=null;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){if(dx<0)to(pos+1,"L");else to(pos-1,"R")}});
  };
  grid();
}

/* 2 問答挑戰 */
function lvQuiz(t,body){const N=8,PASS=6;
  const qs=shuffle(t.items).slice(0,N).map((it,k)=>({it,type:k%2,opts:pickOpts(t,it)}));let qi=0,sc=0,lock=false;
  const draw=()=>{const q=qs[qi],it=q.it;lock=false;
    body.innerHTML=head(`第 ${qi+1} / ${N} 題`,`⭐ ${sc}`)+`<div class="qbox">${q.type===0?`<div class="q en">${it.d} ${say(it.d)}</div><div class="q">${it.dz}</div><div class="ask">這是哪一個？<span class="en"> Which one is it?</span></div>`
       :`<div class="big">${it.e}</div><div class="zhw">${it.zh}</div><div class="ask">英文怎麼說？<span class="en"> What is it in English?</span></div>`}</div>
     <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${q.type===0?`${o.e} <span class="en">${o.en}</span>｜${o.zh}`:`<span class="en">${o.en}</span>`}</button>`).join("")}</div><div id="fb"></div>`;
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const right=q.opts[+b.dataset.k]===it;if(right)sc++;
      body.querySelectorAll(".opt").forEach(x=>{if(q.opts[+x.dataset.k]===it)x.classList.add("good");else if(x===b)x.classList.add("wrong")});speak(it.en);
      $("#fb").innerHTML=`<div class="fb">${right?"✅ 答對了！":"❌ 正確答案是："}<br>${it.e} <span class="en big2">${it.en}</span> ${say(it.en)}｜${it.zh}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"quiz",sc>=PASS,`答對 ${sc} / ${N} 題${sc>=PASS?"，太厲害了！":`，答對 ${PASS} 題就能過關。`}`)}});
  };draw();
}

/* 3 聽力挑戰 */
function lvListen(t,body){const N=8,PASS=6;const qs=shuffle(t.items).slice(0,N).map(it=>({it,opts:pickOpts(t,it)}));let qi=0,sc=0,lock=false;
  const draw=()=>{const q=qs[qi],it=q.it;lock=false;
    body.innerHTML=head(`第 ${qi+1} / ${N} 題`,`⭐ ${sc}`)+`<div class="qbox"><div class="ask">聽英文，選出正確的圖 <span class="en">Listen and choose</span></div>
      <div class="playrow"><button class="play" data-say="${esc(it.en)}">🔊 播放</button><button class="play slow" data-say="${esc(it.en)}" data-slow="1">🐢 慢速</button></div>
      <button class="peek" id="pk">看不到聲音嗎？點我顯示英文</button></div>
     <div class="opts g2">${q.opts.map((o,k)=>`<button class="opt big3" data-k="${k}"><span class="oe2">${o.e}</span>${o.zh}</button>`).join("")}</div><div id="fb"></div>`;
    $("#pk").onclick=e=>{e.target.outerHTML=`<div class="en big2">${it.en}</div>`};
    later(()=>speak(it.en),250);
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const right=q.opts[+b.dataset.k]===it;if(right)sc++;
      body.querySelectorAll(".opt").forEach(x=>{if(q.opts[+x.dataset.k]===it)x.classList.add("good");else if(x===b)x.classList.add("wrong")});speak(it.en);
      $("#fb").innerHTML=`<div class="fb">${right?"✅ 聽對了！":"❌ 剛剛唸的是："}<br>${it.e} <span class="en big2">${it.en}</span> ${say(it.en)}｜${it.zh}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"listen",sc>=PASS,`聽對 ${sc} / ${N} 題${sc>=PASS?"，耳朵真靈！":`，聽對 ${PASS} 題就能過關。`}`)}});
  };draw();
}

/* 4 拼字高手 */
function spWord(it){if(it.sp===null)return null;if(!it.sp&&/'/.test(it.en))return null;const w=(it.sp||it.en.split(" ").pop()).toLowerCase().replace(/[^a-z]/g,"");return w.length>=3&&w.length<=12?w:null}
function lvSpell(t,body){const pool=shuffle(t.items.filter(spWord));const N=Math.min(6,pool.length),PASS=Math.ceil(N*.67);let qi=0,sc=0;
  const draw=()=>{const it=pool[qi],w=spWord(it);let typed=[];
    const re=new RegExp(w,"i");const src=[it.en,it.d].find(s=>re.test(s.replace(/'/g,"")));
    const hint=src?esc(src.replace(re,"＿".repeat(w.length))):"";
    const AZ="abcdefghijklmnopqrstuvwxyz";const decoy=[];while(decoy.length<2){const c=AZ[Math.floor(Math.random()*26)];if(!w.includes(c))decoy.push(c)}
    const tiles=shuffle([...w.split(""),...decoy]).map((c,i)=>({c,i,used:false}));

/* 10 消消樂 */
function lvMatch3(t,body){const N=7,K=6,GOAL=300,MOVES=20;const types=shuffle(t.items).slice(0,K);
  let g=[],score=0,moves=MOVES,busy=false,sel=-1,hintId=null,ended=false;
  body.innerHTML=`<div class="stat"><span>🎯 目標 <b>${GOAL}</b></span><span>⭐ 分數 <b id="sc">0</b></span><span>👣 剩餘 <b id="mv">${MOVES}</b> 步</span></div>
   <div class="chips">${types.map(x=>`<button class="chip" data-say="${esc(x.en)}">${x.e} ${x.zh} 🔊</button>`).join("")}</div>
   <div class="board" id="bd"></div><p class="tip">點兩個相鄰圖案交換，或直接滑動；3 個以上連成一線就消除！10 秒沒動作會亮出提示。</p>`;
  const bd=$("#bd"),rnd=()=>Math.floor(Math.random()*K),sw=(a,b)=>{const x=g[a];g[a]=g[b];g[b]=x};
  const adj=(a,b)=>(Math.abs(a-b)===1&&Math.floor(a/N)===Math.floor(b/N))||Math.abs(a-b)===N;
  function matches(){const s=new Set();
    for(let r=0;r<N;r++){let c=0;while(c<N){const v=g[r*N+c];let e=c;while(e+1<N&&v>=0&&g[r*N+e+1]===v)e++;if(v>=0&&e-c>=2)for(let k=c;k<=e;k++)s.add(r*N+k);c=e+1}}
    for(let c=0;c<N;c++){let r=0;while(r<N){const v=g[r*N+c];let e=r;while(e+1<N&&v>=0&&g[(e+1)*N+c]===v)e++;if(v>=0&&e-r>=2)for(let k=r;k<=e;k++)s.add(k*N+c);r=e+1}}return s}
  function findMove(){for(let i=0;i<N*N;i++)for(const j of [i%N<N-1?i+1:-1,i+N<N*N?i+N:-1]){if(j<0)continue;sw(i,j);const m=matches().size;sw(i,j);if(m)return[i,j]}return null}
  function gen(){do{g=[];for(let i=0;i<N*N;i++){let v;do{v=rnd()}while((i%N>=2&&g[i-1]===v&&g[i-2]===v)||(i>=2*N&&g[i-N]===v&&g[i-2*N]===v));g.push(v)}}while(!findMove())}
  function draw(cls={}){bd.innerHTML=g.map((v,i)=>`<div class="cell ${cls[i]||""} ${i===sel?"sel":""}" data-i="${i}">${v>=0?types[v].e:""}</div>`).join("")}
  const upd=()=>{$("#sc").textContent=score;$("#mv").textContent=moves};
  function armHint(){clearTimeout(hintId);hintId=setTimeout(()=>{if(busy||ended)return;const m=findMove();if(m)m.forEach(i=>bd.children[i]&&bd.children[i].classList.add("hint"))},10000)}
  cleanups.push(()=>clearTimeout(hintId));
  async function trySwap(a,b){if(busy||ended||!adj(a,b))return;busy=true;sel=-1;clearTimeout(hintId);sw(a,b);draw();await wait(140);let m=matches();
    if(!m.size){sw(a,b);draw({[a]:"shake",[b]:"shake"});await wait(320);busy=false;armHint();return}
    moves--;let combo=1,said=false;
    while(m.size){const first=g[[...m][0]];score+=m.size*10*combo;
      if(!said){said=true;const it=types[first];toast(`${it.e} <span class="en">${it.en}</span>｜${it.zh}`);speak(it.en)}else toast(`🔥 連鎖 x${combo}！`,900);
      const c1={};m.forEach(i=>c1[i]="pop");draw(c1);upd();await wait(270);m.forEach(i=>g[i]=-1);const fr={};
      for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--){const v=g[r*N+c];if(v>=0){if(w!==r){g[w*N+c]=v;fr[w*N+c]="drop"}w--}}for(let r=w;r>=0;r--){g[r*N+c]=rnd();fr[r*N+c]="drop"}}
      draw(fr);await wait(260);m=matches();combo++}
    upd();
    if(score>=GOAL){ended=true;later(()=>finishLevel(t,"match3",true,`得分 ${score}，還剩 ${moves} 步！`),500);return}
    if(moves<=0){ended=true;later(()=>finishLevel(t,"match3",false,`得分 ${score}，目標是 ${GOAL} 分，再接再厲！`),500);return}
    if(!findMove()){toast("沒有可交換的組合，重新洗牌！");await wait(700);gen();draw()}
    busy=false;armHint()}
  let st=null;
  bd.addEventListener("pointerdown",e=>{const c=e.target.closest(".cell");if(!c)return;st={i:+c.dataset.i,x:e.clientX,y:e.clientY};try{bd.setPointerCapture(e.pointerId)}catch(_){}});
  bd.addEventListener("pointerup",e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y,i=st.i;st=null;if(busy||ended)return;
    if(Math.max(Math.abs(dx),Math.abs(dy))>22){let j;if(Math.abs(dx)>Math.abs(dy))j=dx>0?(i%N<N-1?i+1:-1):(i%N>0?i-1:-1);else j=dy>0?(i+N<N*N?i+N:-1):(i-N>=0?i-N:-1);if(j>=0)trySwap(i,j);return}
    if(sel<0){sel=i;draw()}else if(sel===i){sel=-1;draw()}else if(adj(sel,i))trySwap(sel,i);else{sel=i;draw()}});
  bd.addEventListener("pointercancel",()=>{st=null});
  gen();draw();armHint();
}

/* 11 收集大作戰 */
function lvCollectPlay(t,body){const GOAL=8,TIME=60;let got=0,time=TIME,ended=false,items=[],acc=0,last=performance.now(),raf,target=null;
  body.innerHTML=`<div class="stat"><span>⏱️ 時間 <b id="tm">${TIME}</b> 秒</span><span>🧺 收集 <b id="gt">0</b> / ${GOAL}</span></div>
   <div class="target" id="tg"></div><div class="arena" id="ar"></div><div class="basket" id="bk"><span class="lb">我的籃子</span></div>
   <p class="tip">看英文找圖案！點對就收進籃子；點錯會扣 3 秒。</p>`;
  const ar=$("#ar"),rand=()=>t.items[Math.floor(Math.random()*t.items.length)];
  const newTarget=()=>{let n;do{n=rand()}while(n===target&&t.items.length>1);target=n;setTimeout(()=>tgSwap(got?`🔄 換新目標！<small>New target: ${n.en}</small>`:`🎯 開始！<small>Find: ${n.en}</small>`),0);
    $("#tg").innerHTML=`<span class="lbl">找找看 Find:</span><span class="en">${n.en}</span> ${say(n.en)}<div class="zs">（${n.zh}）</div><div class="hint3">💡 提示：找這個圖案 <span class="he">${n.e}</span></div>`};
  function floatTxt(x,y,txt,col){const f=document.createElement("div");f.className="float";f.style.left=Math.max(0,Math.min(x-20,ar.clientWidth-150))+"px";f.style.top=Math.max(0,y)+"px";f.style.color=col;f.innerHTML=txt;ar.appendChild(f);setTimeout(()=>f.remove(),900)}
  function spawn(){const W=ar.clientWidth,it=Math.random()<.5?target:rand();const el=document.createElement("button");el.className="fall";el.innerHTML=it.e;el.setAttribute("aria-label",it.zh);
    const o={it,el,x:Math.random()*Math.max(10,W-70),y:-70,v:48+Math.random()*30+(TIME-time)*.5};el.style.transform=`translate(${o.x}px,${o.y}px)`;
    el.addEventListener("pointerdown",ev=>{ev.preventDefault();hit(o)});ar.appendChild(el);items.push(o)}
  function hit(o){if(ended||o.dead)return;
    if(o.it===target){o.dead=true;got++;o.el.remove();floatTxt(o.x,o.y,`+1 ${o.it.en}`,"var(--ok)");speak(o.it.en);
      $("#bk").insertAdjacentHTML("beforeend",`<span title="${esc(o.it.zh)}">${o.it.e}</span>`);$("#gt").textContent=got;if(got>=GOAL){end(true);return}newTarget()}
    else{o.dead=true;time=Math.max(0,time-3);o.el.classList.add("wrong");floatTxt(o.x,o.y,`−3 秒｜那是 ${o.it.zh}`,"var(--bad)");setTimeout(()=>o.el.remove(),300)}}
  function end(ok){if(ended)return;ended=true;cancelAnimationFrame(raf);later(()=>finishLevel(t,"collect",ok,ok?`你收集了 ${GOAL} 個圖案！`:`時間到！收集了 ${got} / ${GOAL} 個。`),400)}
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(ended)return;time-=dt;acc+=dt;if(acc>.95){acc=0;spawn()}
    const H=ar.clientHeight;items=items.filter(o=>{if(o.dead)return false;o.y+=o.v*dt;if(o.y>H){o.el.remove();return false}o.el.style.transform=`translate(${o.x}px,${o.y}px)`;return true});
    $("#tm").textContent=Math.max(0,Math.ceil(time));if(time<=0){end(false);return}raf=requestAnimationFrame(loop)}
  cleanups.push(()=>{ended=true;cancelAnimationFrame(raf)});newTarget();spawn();raf=requestAnimationFrame(loop);
}

/* 12 配對翻牌／祭典配對 */
function lvPairs(t,body){const its=shuffle(t.items).slice(0,6);const cards=shuffle([...its.map((_,k)=>({k,s:"en"})),...its.map((_,k)=>({k,s:"zh"}))]);let open=[],got=0,tries=0,lock=false;
  body.innerHTML=`<div class="stat"><span>🃏 ${t.ind?"找出族群和他們的代表祭典／文化":"找出英文和中文的配對"}</span><span>翻牌 <b id="tr">0</b> 次</span></div>
   <div class="pgrid">${cards.map((c,i)=>`<button class="pc" data-i="${i}" aria-label="翻牌">?</button>`).join("")}</div>`;
  const face=c=>{const it=its[c.k];return c.s==="en"?`<span class="e">${it.e}</span><span class="t en">${it.en}</span>`:`<span class="tz">${t.ind?it.pz:it.zh}</span>`};
  body.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,c=cards[i];if(lock||c.got||open.includes(i))return;
    b.classList.add("up");b.innerHTML=face(c);if(c.s==="en")speak(its[c.k].en);open.push(i);
    if(open.length===2){tries++;$("#tr").textContent=tries;const[a,d]=open.map(x=>cards[x]);const bs=open.map(x=>body.querySelector(`.pc[data-i="${x}"]`));
      if(a.k===d.k){a.got=d.got=true;bs.forEach(x=>{x.classList.remove("up");x.classList.add("got")});got++;open=[];const it=its[a.k];

/* ================= 發音練習（錄音＋寬鬆評分） ================= */
const SRc=window.SpeechRecognition||window.webkitSpeechRecognition;
function micB(t){return `<button class="mic" data-rec="${esc(t)}" aria-label="跟著唸，練習發音">🎤</button>`}
function say2(t){return say(t)+micB(t)}
function ptoks(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/(\d),(\d)/g,"$1$2").replace(/[–—-]/g," ").replace(/[^a-z0-9' ]/g," ").split(/\s+/).map(w=>w.replace(/^'+|'+$/g,"").replace(/'s$/,"")).filter(Boolean)}
function plev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function pnear(a,b){if(a===b)return true;if(a.length<3||b.length<3)return false;if(a.length>=5&&b.length>=4&&a.slice(0,4)===b.slice(0,4))return true;return plev(a,b)<=(a.length>6?2:1)}
function pscore(target,heard){const T=ptoks(target).filter(w=>!/^\d+$/.test(w));if(!T.length)return {s:100,miss:[],r:1};
  const H=ptoks(heard),used=H.map(()=>false),miss=[];let ok=0;
  T.forEach(w=>{const i=H.findIndex((h,k)=>!used[k]&&pnear(w,h));if(i>=0){used[i]=true;ok++}else if(!miss.includes(w))miss.push(w)});
  const r=ok/T.length;return {s:Math.min(100,Math.round(25+r*85)),miss,r}}
function pverdict(s){return s>=90?["🌟","太棒了！發音非常清楚！","Excellent!",3]:s>=75?["👏","很好！客人一定聽得懂！","Great job!",3]:s>=55?["😊","不錯喔！再唸一次會更好！","Good try!",2]:["💪","加油！先按 🔊 聽一次，再慢慢唸。","Keep going — you can do it!",1]}
let REC=null;
function stopRec(){if(REC){try{REC.onresult=REC.onend=REC.onerror=null;REC.abort()}catch(e){}REC=null}}
/* 錄音並評分：cb(result) ；result = {s,miss,heard} 或 null（失敗） */
function recordInto(box,target,cb){
  const words=ptoks(target).length;
  if(!SRc){box.innerHTML=`<div class="rnote">😅 這個瀏覽器沒有語音辨識功能（LINE 內建瀏覽器常常不支援）。<br>請點右上角「⋯」選擇用 <b>Safari</b> 或 <b>Chrome</b> 開啟，就能錄音評分。<br>現在可以先按 🔊 聽示範，大聲跟著唸三次！<span class="en">Your browser can't listen. Open this page in Safari or Chrome to get a score.</span></div>`;cb(null,"unsupported");return}
  stopRec();try{speechSynthesis.cancel()}catch(e){}
  const r=new SRc();REC=r;r.lang="en-US";r.interimResults=false;r.maxAlternatives=5;r.continuous=words>9;
  let alts=[""],got=false,err=null;
  box.innerHTML=`<div class="rlive">🔴 正在聽…請唸出上面的英文 <span class="en">Listening… read it aloud.</span>${r.continuous?'<div class="note">唸完後按「⏹️ 唸完了」。</div>':""}</div>`;
  r.onresult=e=>{got=true;const segs=[];for(let i=0;i<e.results.length;i++){const res=e.results[i];segs.push([...res].map(a=>a.transcript))}
    /* 組合：第一段的每個候選 + 其他段的第一候選 */
    const rest=segs.slice(1).map(s=>s[0]).join(" ");alts=(segs[0]||[""]).map(a=>a+" "+rest)};
  r.onerror=e=>{err=e.error};
  r.onend=()=>{if(REC!==r)return;REC=null;
    if(!got){const m=err==="not-allowed"||err==="service-not-allowed"?"🎙️ 這個畫面現在不能使用麥克風（可能是瀏覽器或 App 不允許）。沒關係！先按 🔊 聽示範，大聲跟著唸三次。":err==="network"?"📶 語音辨識需要網路，請確認連線後再試一次。":"🤔 沒有聽到聲音，靠近麥克風一點，大聲再試一次！";
      box.innerHTML=`<div class="rnote">${m}<span class="en">I didn't catch that. Try again!</span></div>`;cb(null,err||"nospeech");return}
    let best=null,heard="";alts.forEach(a=>{const sc=pscore(target,a);if(!best||sc.s>best.s){best=sc;heard=a}});best.heard=heard.trim();cb(best)};
  try{r.start()}catch(e){box.innerHTML=`<div class="rnote">🤔 錄音沒有啟動，請再按一次 🎤。</div>`;REC=null;cb(null,"start")}
  return r}

  return `<div class="rres"><div class="rsc"><span class="rbig">${res.s}</span><span class="rst">${"⭐".repeat(v[3])}${"☆".repeat(3-v[3])}</span></div>
   <div class="rv">${v[0]} ${v[1]}<span class="en">${v[2]}</span></div>
   ${res.heard?`<div class="rheard">我聽到：<span class="en">“${esc(res.heard)}”</span></div>`:""}
   ${res.miss.length&&res.s<100?`<div class="rtip">💡 可以多練習這幾個字（點一下聽發音）：<div class="rchips">${res.miss.slice(0,6).map(w=>`<button class="rchip" data-say="${esc(w)}">🔊 ${esc(w)}</button>`).join("")}</div></div>`:""}
   ${ptoks(target).length>12&&res.s<75?`<div class="rtip">✂️ 句子比較長，可以先按 🐢 慢速聽，再分成兩段唸。</div>`:""}</div>`}

function svgPt(svg,ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:0,y:0}}
function nearestPlace(svg,ev){const p=svgPt(svg,ev);let best=null,bd=1e9;PLACES.forEach(q=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}});return bd<=26?best:null}
const plOf=it=>[].concat(it.p);
function lvGeoPlay(t,body){const qs=shuffle(t.items.filter(i=>!i.nogeo)).slice(0,8),N=qs.length,PASS=6;let qi=0,sc=0,lock=false;
  const plu=en=>/ and |people$/.test(en)||(/s$/.test(en)&&!/ss$/.test(en));
  const draw=()=>{const q=qs[qi];lock=false;const qen=q.en.replace(/^The /,"the ");const ask=`Where ${plu(q.en)?"are":"is"} ${qen}? Tap it on the map.`;
    body.innerHTML=head(`第 ${qi+1} / ${N} 題`,`⭐ ${sc}`)+`<div class="qbox"><div class="mq2"><span class="mqe">${q.e}</span><div><b>${esc(q.zh)}</b> 在哪裡？點地圖上的黃色圓點。<br><span class="en">${esc(ask)}</span> ${say(ask)}</div></div></div>
     <div class="twmap ngeo"><svg viewBox="0 0 320 340" role="img" aria-label="日月潭鳥瞰示意圖">${lakeSvg("game")}</svg></div><div id="fb"></div>`;
    const svg=body.querySelector(".ngeo svg");
    svg.addEventListener("click",ev=>{if(lock)return;const p=nearestPlace(svg,ev);if(!p){toast("點黃色圓點喔！");return}lock=true;
      const ans=plOf(q),right=ans.includes(p.id);if(right)sc++;
      ans.forEach(a=>svg.querySelector(`.np[data-p="${a}"]`).classList.add("good"));if(!right)svg.querySelector(`.np[data-p="${p.id}"]`).classList.add("wrong");
      const lab=P=>`<text class="gl" x="${Math.min(290,Math.max(30,P.x))}" y="${P.y<30?P.y+20:P.y-10}" text-anchor="middle">${P.zh}</text>`;
      $("#nlab").innerHTML=ans.map(a=>lab(PLD(a))).join("")+(right?"":lab(p));
      const A=PLD(right?p.id:ans[0]);const nm=q.en.charAt(0).toUpperCase()+q.en.slice(1);const same=q.en.toLowerCase().split(/[\s-]+/).some(w=>w.length>=6&&A.en.toLowerCase().includes(w))||A.en.toLowerCase().replace(/^the /,"")===q.en.toLowerCase();

function lvNumbers(t,body){const qs=shuffle(NUMQ).slice(0,10).map(q=>({...q,opts:shuffle([q.a,...q.o])})),N=qs.length,PASS=7;let qi=0,sc=0,lock=false;
  const draw=()=>{const q=qs[qi];lock=false;
    body.innerHTML=head(`第 ${qi+1} / ${N} 題`,`⭐ ${sc}`)+`<div class="qbox"><div class="big">🔢</div><div class="stmt en">${esc(q.q)}</div><div class="q">${esc(q.z)}</div><div class="ask">選出正確的數字 <span class="en">Choose the number</span></div></div>
     <div class="opts g2">${q.opts.map((o,k)=>`<button class="opt big3" data-k="${k}"><span class="en big2">${esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const right=q.opts[+b.dataset.k]===q.a;if(right)sc++;
      body.querySelectorAll(".opt").forEach(x=>{if(q.opts[+x.dataset.k]===q.a)x.classList.add("good");else if(x===b)x.classList.add("wrong")});speak(q.s);
      $("#fb").innerHTML=`<div class="fb">${right?"✅ 答對了！":"❌ 正確答案是："}<span class="en big2">${esc(q.a)}</span><br><span class="en">${esc(q.s)}</span> ${say(q.s)}<div class="note">${esc(q.x)}</div>${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"numbers",sc>=PASS,`答對 ${sc} / ${N} 題${sc>=PASS?"，數字都記準了！":`，答對 ${PASS} 題就能過關。`}`)}});
  };draw();}

function lvSpeak(t,body){const qs=shuffle(SPK.slice()).slice(0,6),N=qs.length,PASS=4,MIN=50;let qi=0;const best=qs.map(()=>null);
  const draw=()=>{const [en,zh,e]=qs[qi];let busy=false;
    body.innerHTML=`<div class="bonus-bar"><span class="bonus-b">⭐ 加分題 Bonus</span> 這關是額外加分，不影響集滿印章。<span class="en">Extra credit — not required.</span></div>`+head(`第 ${qi+1} / ${N} 句`,`🎤 ${best.filter(s=>s!==null&&s>=MIN).length} / ${N} 句過關`)+`<div class="qbox"><div class="big">${e}</div><div class="ask">像導遊一樣，大聲唸出這句話！<span class="en">Say it like a guide!</span></div>

      <button class="btn pri rgo" id="rg">🎤 開始錄音</button><div id="rb"></div></div><div id="fb"></div>`;
    const rg=$("#rg"),rb=$("#rb");
    const after=()=>{const ok=best[qi]!==null&&best[qi]>=MIN;$("#fb").innerHTML=`<div class="fb">${ok?"✅ 這句過關了！":"💪 再唸一次，60 分以上就很棒了！"}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else{const n=best.filter(s=>s!==null&&s>=MIN).length;finishLevel(t,"speak",n>=PASS,`唸好了 ${n} / ${N} 句${n>=PASS?"，你的英文導覽越來越流利了！<br><b>+⭐ 加分！</b>（加分題 Bonus）":`，唸好 ${PASS} 句就能過關。多聽幾次示範再試試！`}`)}}};
    rg.onclick=()=>{if(busy&&REC){try{REC.stop()}catch(e){}return}busy=true;rg.textContent="⏹️ 唸完了";
      const r=recordInto(rb,en,(res,why)=>{busy=false;rg.textContent="🎤 再錄一次";
        if(res){best[qi]=Math.max(best[qi]||0,res.s);rb.innerHTML=resultHTML(res,en);try{if(res.s>=55)SFX.next()}catch(e){}after()}
        else if(!$("#self")){rb.insertAdjacentHTML("beforeend",`<button class="btn" id="self" style="margin-top:8px">✅ 我已經跟著大聲唸三次了</button>`);
          $("#self").onclick=()=>{best[qi]=Math.max(best[qi]||0,60);$("#self").remove();toast("👍 很好！繼續加油！");after()};if(why!=="nospeech"&&why!=="no-speech")rg.style.display="none"}});
      if(!r){busy=false;rg.textContent="🎤 開始錄音"}};
  };draw();}

lvCollect=function(t,body){const cats=t.cats.filter(c=>t.items.filter(i=>i.c===c.id).length>=3),d=cats[Math.floor(Math.random()*cats.length)];
  const mine=t.items.filter(s=>s.c===d.id),other=t.items.filter(s=>s.c!==d.id),a=shuffle(mine.slice())[0],o=shuffle(other.slice()).slice(0,2);
  body.innerHTML=`<div class="cdemo"><div class="ch">🧺 收集各區景點，怎麼玩？<span class="en">How to play</span></div>
   <ol class="csteps"><li>上方會指定一個<b>區域</b>，例如「收集伊達邵・邵族的景點」。<span class="en">The top shows one area, like "Collect sights in Ita Thao".</span></li>
   <li>景點卡會從上面掉下來，<b>只點屬於這一區的</b>。<span class="en">Cards fall from the top. Tap only the ones in that area.</span></li>

   <li>每收集 3 個，會換一個區域（畫面會跳出提示）；<b>60 秒內收集 8 個</b>就過關！<span class="en">Every 3 cards, the area changes. Collect 8 in 60 seconds to pass!</span></li></ol>
   <div class="cex"><div class="cexh">📌 範例 Example</div>
    <div class="ctg"><span class="lbl">收集 Collect:</span> <b>${d.e} ${d.zh}</b> 的景點 <span class="en" style="display:inline">${d.en}</span> ${say(d.en)}</div>
    <div class="car">
     <div class="cf ok" style="left:6%;top:14%"><span class="chip2">${a.e} ${a.zh}</span><span class="ctag ok">👆 點這個！ +1</span></div>
     <div class="cf no" style="left:36%;top:54%"><span class="chip2">${o[0].e} ${o[0].zh}</span><span class="ctag no">✗ ${catOf(t,o[0].c).zh}・−3 秒</span></div>
     <div class="cf no" style="left:52%;top:8%"><span class="chip2">${o[1].e} ${o[1].zh}</span><span class="ctag no">✗ ${catOf(t,o[1].c).zh}・−3 秒</span></div></div>
    <div class="cbk">🧺 我的籃子：<span>${a.e}</span></div>
    <p class="ccap">要收集的是「${d.zh}」，所以點「${a.zh}」；「${o[0].zh}」在${catOf(t,o[0].c).zh}、「${o[1].zh}」在${catOf(t,o[1].c).zh}，點了會扣時間。<span class="en">Collect sights in ${d.en}, so tap ${a.en}.</span></p></div>
   <div class="btns"><button class="btn pri" id="cgo">我懂了，開始！ Start</button></div></div>`;
  $("#cgo").onclick=()=>areaCollectPlay(t,body,cats,d);
};
function areaCollectPlay(t,body,cats,first){const GOAL=8,TIME=60;let got=0,inRound=0,time=TIME,ended=false,items=[],acc=0,last=performance.now(),raf,dist=null;
  body.innerHTML=`<div class="stat"><span>⏱️ 時間 <b id="tm">${TIME}</b> 秒</span><span>🧺 收集 <b id="gt">0</b> / ${GOAL}</span></div>
   <div class="target" id="tg"></div><div class="arena" id="ar"></div><div class="basket" id="bk"><span class="lb">我的籃子</span></div>
   <p class="tip">只點屬於指定區域的景點！點錯扣 3 秒。</p>`;
  const ar=$("#ar");
  const newDist=n=>{if(!n){do{n=cats[Math.floor(Math.random()*cats.length)]}while(n===dist)}dist=n;inRound=0;setTimeout(()=>tgSwap(got?`🔄 換區了！<small>現在收集：${n.zh} ${n.en}</small>`:`🎯 開始！<small>收集：${n.zh} ${n.en}</small>`),0);
    $("#tg").innerHTML=`<span class="lbl">收集 Collect:</span><span class="en">${dist.e} ${dist.en}</span> ${say(dist.en)}<div class="zs">（${dist.zh}的景點）</div>`;speak(dist.en)};
  function floatTxt(x,y,txt,col){const f=document.createElement("div");f.className="float";f.style.left=Math.max(0,Math.min(x-20,ar.clientWidth-190))+"px";f.style.top=Math.max(0,y)+"px";f.style.color=col;f.innerHTML=txt;ar.appendChild(f);setTimeout(()=>f.remove(),1100)}
  function spawn(){const W=ar.clientWidth,pool=Math.random()<.45?t.items.filter(s=>s.c===dist.id):t.items,it=pool[Math.floor(Math.random()*pool.length)];
    const el=document.createElement("button");el.className="fall chipf";el.innerHTML=`${it.e} ${it.zh}`;el.setAttribute("aria-label",it.zh);
    const o={it,el,x:Math.random()*Math.max(10,W-160),y:-50,v:48+Math.random()*34+(TIME-time)*.6};el.style.transform=`translate(${o.x}px,${o.y}px)`;
    el.addEventListener("pointerdown",ev=>{ev.preventDefault();hit(o)});ar.appendChild(el);items.push(o)}
  function hit(o){if(ended||o.dead)return;o.dead=true;
    if(o.it.c===dist.id){got++;inRound++;o.el.remove();floatTxt(o.x,o.y,`+1 ${o.it.zh}`,"var(--ok)");speak(o.it.en);
      $("#bk").insertAdjacentHTML("beforeend",`<span title="${esc(o.it.zh)}">${o.it.e}</span>`);$("#gt").textContent=got;if(got>=GOAL){end(true);return}if(inRound>=3)newDist()}
    else{time=Math.max(0,time-3);o.el.classList.add("wrong");floatTxt(o.x,o.y,`−3 秒｜${o.it.zh}在${catOf(t,o.it.c).zh}`,"var(--bad)");setTimeout(()=>o.el.remove(),300)}}
  function end(ok){if(ended)return;ended=true;cancelAnimationFrame(raf);later(()=>finishLevel(t,"collect",ok,ok?`你收集了 ${GOAL} 個景點！`:`時間到！收集了 ${got} / ${GOAL} 個。`),400)}
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(ended)return;time-=dt;acc+=dt;if(acc>.9){acc=0;spawn()}
    const H=ar.clientHeight;items=items.filter(o=>{if(o.dead)return false;o.y+=o.v*dt;if(o.y>H){o.el.remove();return false}o.el.style.transform=`translate(${o.x}px,${o.y}px)`;return true});
    $("#tm").textContent=Math.max(0,Math.ceil(time));if(time<=0){end(false);return}raf=requestAnimationFrame(loop)}
  cleanups.push(()=>{ended=true;cancelAnimationFrame(raf)});newDist(first);spawn();raf=requestAnimationFrame(loop);
}

 const OK=/(^|\s)(good|right|correct)(\s|$)/,BAD=/(^|\s)(wrong|bad|shake|hurt|incorrect)(\s|$)/;

  if(n.classList&&n.classList.contains("float")){const col=n.style.color||"";if(/bad/.test(col)||/^[−-]/.test(t))return"bad";if(/ok/.test(col)||/^\+/.test(t))return"ok";return null}

<script>/*SV*/window.SV_CFG={"topic": "sunmoon", "head": "一分鐘認識日月潭", "headEn": "Sun Moon Lake in one minute", "scenes": [{"title": "日月潭", "sub": "Sun Moon Lake", "big": "topic", "en": "In the mountains of Nantou lies Taiwan's most famous lake. Let's sail around Sun Moon Lake in one minute.", "zh": "在南投的群山之中，有臺灣最有名的湖。用一分鐘繞日月潭一圈。"}, {"cat": "lake", "items": ["Sun Lake", "Moon Lake", "Lalu Island"], "en": "The round basin in the northeast looks like the sun, and the slender crescent in the southwest looks like a new moon. Lalu Island is sacred to the Thao. No one may land there.", "zh": "東北邊圓圓的湖面像太陽，西南邊細長的彎月像新月。拉魯島是邵族的聖地，任何人都不能登島。"}, {"cat": "lake", "items": ["Hydroelectric scheme", "Water tunnel", "Pumped storage"], "en": "Work on a hydroelectric scheme began in 1919. It raised the water about 18 meters and joined two lakes into one. Today the lake is still a working reservoir.", "zh": "水力發電工程在 1919 年開工，讓水位上升約 18 公尺，把兩個湖連成一個。今天它仍是一座運作中的水庫。"}, {"cat": "shuishe", "items": ["Shuishe Pier", "Water-level bikeway", "Ferry triangle"], "en": "Shuishe Pier is the main gateway. Ride the bikeway that floats just above the water, or hop on the ferries between three piers.", "zh": "水社碼頭是主要門戶。騎上貼著水面的自行車道，或搭遊艇往返三個碼頭。"}, {"cat": "wenwu", "items": ["Wenwu Temple", "Confucius", "Guan Gong and Yue Fei"], "en": "Wenwu Temple honors civil and martial gods under one roof: Confucius the teacher, and the warriors Guan Gong and Yue Fei.", "zh": "文武廟在同一個屋簷下供奉文神和武神：文的是孔子，武的是關公和岳飛。"}, {"cat": "south", "items": ["Xuanguang Temple", "Tea eggs", "Ci'en Pagoda"], "en": "Xuanguang Temple has its own ferry stop, and a famous tea egg stand. Ci'en Pagoda is 46 meters high, and its tip is exactly 1,000 meters above sea level.", "zh": "玄光寺有自己的碼頭，還有有名的阿婆茶葉蛋。慈恩塔高 46 公尺，塔頂正好在海拔 1,000 公尺。"}, {"cat": "ita", "items": ["The Thao people", "White deer legend", "Pestle music"], "en": "The Thao are the smallest recognized Indigenous nation in Taiwan. Their hunters followed a white deer and found this lake. Listen for pestle music at Ita Thao.", "zh": "邵族是臺灣人數最少的原住民族。祖先追著白鹿翻山越嶺，發現了這座湖。到伊達邵聽聽杵音。"}, {"cat": "hills", "items": ["Sun Moon Lake Ropeway", "Assam black tea", "Ruby black tea"], "en": "The ropeway climbs over two ridges from Ita Thao. In the hills of Yuchi, Assam and Ruby black tea grow in the mist.", "zh": "纜車從伊達邵出發，越過兩道山稜。魚池的山坡在雲霧中種著阿薩姆和紅玉紅茶。"}, {"title": "開始遊戲", "sub": "Let's play!", "big": "topic", "en": "Sun, moon, temples and tea. Let's learn the words and play!", "zh": "太陽、月亮、廟宇和茶。一起來學單字、玩遊戲吧！"}]};window.MV_AUDIO=Object.assign(window.MV_AUDIO||{},{"In the mountains of Nantou lies Taiwan's most famous lake. Let's sail around Sun Moon Lake in one minute.": "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//NkxAAAAANIAAAAAExBTUVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVUdIV4VBLRM0kWA302ZcChA9cGGjAGBBiZSBOkzM2LKNTBziB5lN68QGadJ0sUdODAbCA44RRhaVi6bpk8J4aU0ppU3iOyHCdPOZf1ifppewjMnQGxHkZOlMRSfyfSkZaXLmaWKaQqaE8SFTTuX/nCd3ggOxdUXEDjhFFv6//NkxHwAAANIAAAAAFNKfmivpUfKK4RRAMxANgTlEhhGrwKUvYA2LYLAroJkHojoMc57EgHAaBwQFYpGVnjQ4GyCCFqMyjKDCcnxpyxhdlZV8ZLqQ0UKAYIEK3CgnI9Sw8TgHAOGdAHpYMIDp8gD58beICFSZAdqaIGDTGToKEkzpMdRExK1NBxQkyZNoMLn//NkxP8jfAnoAHmGdMvKEskSIELa5Q/fehRM1cVIMJGEk+wKMQLwRzLkpttSaCHny7S6OUxRMnXbhTDtnqjBBGlSen3sM6Tqguc
