<script>
const STD=["learn","quiz","listen","spell","tf","sort","geo","tpmap","mrt","plan","numbers","match3","collect","pairs"];
/* 臭豆腐圖示：金黃炸豆腐塊＋泡菜 */
const TOFU=`<svg class="emo" viewBox="0 0 64 64" width="1em" height="1em" style="vertical-align:-0.12em" role="img" aria-label="臭豆腐"><ellipse cx="32" cy="51" rx="29" ry="9" fill="#F6F3EA" stroke="#C9C2B2" stroke-width="2"/><rect x="7" y="27" width="22" height="20" rx="4" fill="#D9932E" stroke="#9A5B17" stroke-width="2"/><rect x="31" y="23" width="22" height="22" rx="4" fill="#E6A940" stroke="#9A5B17" stroke-width="2"/><rect x="19" y="35" width="23" height="16" rx="4" fill="#C9822A" stroke="#9A5B17" stroke-width="2"/><path d="M37 17c5-4 11-3 15 1M45 12c3 2 5 5 4 9M30 20c2-4 6-6 10-5" stroke="#8CC45A" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M33 19c3-2 7-2 9 0" stroke="#F1EBCF" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="51" cy="19" r="2.6" fill="#E04B3A"/></svg>`;
const TOPICS=[
{id:"taipei",zh:"認識臺北",en:"Welcome to Taipei",icon:"🏙️",color:"#1F7A8C",levels:STD,
 intro:["Taipei sits at the bottom of a basin with mountains on every side. It is home to Taiwan's central government and is the most crowded city in Taiwan — and in one day you can walk through three hundred years of history.","臺北坐落在四面環山的盆地底部，是中央政府所在地，也是全臺人口密度最高的城市；一天之內，就能走過三百年的歷史。"],
 sortTitle:"它屬於哪一類？",
 cats:[{id:"temple",e:"🏮",zh:"廟宇與信仰",en:"Temples"},{id:"old",e:"🧱",zh:"老街與古蹟",en:"Old streets & monuments"},{id:"modern",e:"🏙️",zh:"現代臺北",en:"Modern Taipei"},{id:"nature",e:"⛰️",zh:"山・溫泉・茶",en:"Mountains & hot springs"},{id:"food",e:"🍢",zh:"夜市小吃",en:"Night-market food"}],
 items:[
 {e:"🐉",en:"Longshan Temple",zh:"龍山寺",c:"temple",sp:"dragon",d:"Taipei's most famous temple, founded in 1738 in Bangka, the oldest part of the city. Its main goddess is Guanyin, and its bronze dragon columns were the first ever made in Taiwan.",dz:"臺北最有名的廟，1738 年創建於最古老的街區艋舺；主祀觀音，前殿的鑄銅龍柱是全臺第一對。"},
 {e:"🧶",en:"Xiahai City God Temple",zh:"霞海城隍廟",c:"temple",sp:"thread",d:"A tiny temple on Dihua Street, only about 150 square meters. Visitors fly in from Japan, Korea and Hong Kong to ask Yue Lao, the god of marriage, for a red thread.",dz:"迪化街上的小廟，面積只有約 150 平方公尺；有人專程從日本、韓國、香港飛來，向月老求一條紅線。"},
 {e:"🩺",en:"Bao'an Temple",zh:"保安宮",c:"temple",sp:"medicine",d:"A temple for Emperor Baosheng, the god of medicine. Its careful restoration won a UNESCO Asia-Pacific heritage award in 2003.",dz:"主祀醫神保生大帝；廟的修復工程在 2003 年獲得聯合國教科文組織亞太文化資產保存獎。"},
 {e:"📜",en:"Taipei Confucius Temple",zh:"臺北孔廟",c:"temple",sp:"teacher",d:"A quiet temple with no statue of Confucius, only spirit tablets, because he is honored as a teacher, not worshipped as a god.",dz:"安靜的廟，殿內沒有孔子塑像，只有神主牌，因為孔子是以老師的身分受敬，而不是被當成神來拜。"},
 {e:"🙏",en:"Xingtian Temple",zh:"行天宮",c:"temple",sp:"incense",d:"A busy temple for Guan Gong. In 2014 it removed its incense burners, so people now pray with their hands alone.",dz:"主祀關公、香火鼎盛；2014 年撤除香爐，信眾改以雙手合十祈禱。"},
 {e:"🧱",en:"Bopiliao",zh:"剝皮寮",c:"old",sp:"street",d:"A preserved old street beside Longshan Temple. One block shows three periods at once: Qing, Japanese and after the war.",dz:"龍山寺旁保存下來的老街廓，同一個街區就看得到清代、日治和戰後三個時期的建築。"},
 {e:"🌿",en:"Herb Alley",zh:"青草巷",c:"old",sp:"herb",d:"A short lane of shops selling fresh and dried medicinal plants. In summer, locals drink a cup of bitter herbal tea to cool down.",dz:"一條賣新鮮與乾燥藥草的短巷；夏天在地人會喝一杯苦苦的青草茶退火。"},
 {e:"🍄",en:"Dihua Street",zh:"迪化街",c:"old",sp:"market",d:"The old tea and trade street of Dadaocheng. Shops sell dried seafood, mushrooms and fabric, and it holds Taipei's biggest Lunar New Year market.",dz:"大稻埕的老茶街與貿易街，賣乾貨、香菇和布料，也是臺北最大的年貨大街。"},
 {e:"🎬",en:"Ximending",zh:"西門町與紅樓",c:"old",sp:"cinema",d:"Ximending means 'outside the west gate'. Its octagonal Red House from 1908 was once a market; today the area is full of young people, shops and cinemas.",dz:"西門町就是「西門之外」；1908 年的八角形紅樓原本是市場，今天這一帶擠滿年輕人、商店和電影院。"},
 {e:"🚪",en:"North Gate",zh:"北門",c:"old",sp:"gate",d:"Finished in 1884, it is the only gate of old Taipei that still looks the way it did in the Qing era.",dz:"1884 年完工，是臺北城唯一保持清代原貌的城門。"},
 {e:"🏰",en:"Presidential Office Building",zh:"總統府",c:"old",sp:"tower",d:"A red-brick building finished in 1919 with a 60-meter central tower. From above, its floor plan looks like the Japanese character for 'sun'.",dz:"1919 年完工的紅磚建築，中央塔樓高 60 公尺；從上面看，平面像日文的「日」字。"},
 {e:"🏙️",en:"Taipei 101",zh:"台北 101",c:"modern",sp:"bamboo",d:"508 meters tall with 101 floors, finished in 2004. Its eight sections of eight floors look like bamboo, and eight is a lucky number.",dz:"高 508 公尺、101 層，2004 年完工；八個八層的單元像一節節竹子，「八」也代表興旺。"},
 {e:"🟡",en:"Tuned mass damper",zh:"阻尼器",c:"modern",sp:"damper",d:"A 660-tonne golden steel ball hanging inside Taipei 101. When the building leans in a typhoon, the ball swings the other way.",dz:"台北 101 裡懸吊的 660 公噸金色鋼球；颱風時大樓往一邊傾，鋼球就往另一邊擺。"},
 {e:"🚇",en:"Taipei Metro",zh:"台北捷運",c:"modern",sp:"metro",d:"Everyone calls it the MRT. It opened in 1996, and its lines are named by color. No eating or drinking in the paid area — not even water!",dz:"大家都叫它 MRT，1996 年通車，路線用顏色命名；付費區內不能吃喝，連喝水都不行！"},
 {e:"🥬",en:"Jadeite Cabbage",zh:"翠玉白菜",c:"modern",sp:"cabbage",d:"A star of the National Palace Museum: a piece of jade carved into a cabbage, with two insects hidden on its leaves.",dz:"故宮的明星展品：一塊玉雕成白菜，葉子上還藏著兩隻昆蟲。"},
 {e:"🏭",en:"Songshan Cultural and Creative Park",zh:"松山文創園區",c:"modern",sp:"factory",d:"A tobacco factory from 1937, now full of design shows. Tricky fact: it is in Xinyi District, not Songshan District!",dz:"1937 年的菸廠，現在是設計展覽的園區。陷阱題：它在信義區，不在松山區！"},
 {e:"💂",en:"Liberty Square",zh:"自由廣場",c:"modern",sp:"guard",d:"Taipei's largest ceremonial square. Since July 2024, there is no guard change inside the hall. Instead, the honor guard does an outdoor drill below the main steps every hour from 9 a.m. to 5 p.m., except in rain.",dz:"臺北最大的儀典廣場。2024 年 7 月 15 日起，儀隊不再在紀念堂內站哨、交接；改在主階梯下方的民主大道做戶外巡查與操演，每天 9:00–17:00 整點一次，每次約 15 分鐘，雨天取消。"},
 {e:"♨️",en:"Beitou Hot Spring Museum",zh:"北投溫泉博物館",c:"nature",sp:"bathhouse",d:"A public bathhouse from 1913, brick below and wood above, with stained-glass windows. It is now a museum.",dz:"1913 年的公共浴場，下磚上木、有彩繪玻璃，現在是博物館。"},
 {e:"🌫️",en:"Thermal Valley",zh:"地熱谷",c:"nature",sp:"valley",d:"A steaming green pool in Beitou, strongly acidic and hot enough to cook an egg. Always stay behind the railing!",dz:"北投冒著白煙的綠色泉池，強酸性，熱到能煮熟雞蛋；一定要待在欄杆後面！"},
 {e:"💎",en:"Hokutolite",zh:"北投石",c:"nature",sp:"mineral",d:"A rare mineral found in Beitou in 1905. It is the only mineral named after a place in Taiwan, and collecting it is not allowed.",dz:"1905 年在北投發現的稀有礦物，是唯一以臺灣地名命名的礦物，禁止採集。"},
 {e:"🌋",en:"Xiaoyoukeng",zh:"小油坑",c:"nature",sp:"sulfur",d:"On Yangmingshan, sulfur gas roars out of a bare yellow hillside. It is part of the Datun volcano group.",dz:"陽明山上，硫磺氣體從光禿禿的黃色山壁噴出來；這裡屬於大屯火山群。"},
 {e:"🐃",en:"Qingtiangang water buffalo",zh:"擎天崗水牛",c:"nature",sp:"buffalo",d:"Water buffalo graze on this wide grassland on Yangmingshan. Keep your distance — they are half wild.",dz:"水牛在陽明山的擎天崗大草原吃草；請保持距離，牠們接近野放。"},

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const catOf=(t,id)=>t.cats.find(c=>c.id===id);
function pickOpts(t,it,n=4){const others=shuffle(t.items.filter(x=>x!==it&&(!it.grp||x.grp!==it.grp)));
  const res=[];const seen=new Set([it.grp]);for(const o of others){if(res.length>=n-1)break;if(t.ind&&seen.has(o.grp))continue;seen.add(o.grp);res.push(o)}
  for(const o of others){if(res.length>=n-1)break;if(!res.includes(o))res.push(o)}return shuffle([it,...res])}

const S={name:null,prog:{}};
function load(){try{S.name=localStorage.getItem("fg1_taipei_name");S.prog=JSON.parse(localStorage.getItem("fg1_taipei_prog")||"{}")||{}}catch(e){}}
function save(){try{localStorage.setItem("fg1_taipei_prog",JSON.stringify(S.prog))}catch(e){}}
const isDone=(t,l)=>!!(S.prog[t]&&S.prog[t][l]);
const allDone=t=>T(t).levels.every(l=>isDone(t,l));
const count=t=>T(t).levels.filter(l=>isDone(t,l)).length;
function mark(t,l){S.prog[t]=S.prog[t]||{};if(!S.prog[t][l])S.prog[t][l]=Date.now();if(allDone(t)&&!S.prog[t]._all)S.prog[t]._all=Date.now();save()}
let cleanups=[];
function clean(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];try{speechSynthesis.cancel()}catch(e){}}
function later(fn,ms){const id=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(id));return id}
const wait=ms=>new Promise(r=>later(r,ms));
function speak(txt,rate){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=rate||.88;
  const vs=s.getVoices();const v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;s.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}

function toast(html,ms=1500){const el=$("#toast");el.innerHTML=html;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),ms)}
function setHash(h){try{history.replaceState(null,"",location.pathname+location.search+(h?"#"+h:""))}catch(e){}}
function bar(title,sub,topic){return `<div class="bar"><button class="ib" data-go="home" aria-label="回遊戲首頁">🏠 遊戲首頁</button>
 <a class="ib catb" href="/index.html" target="_blank" rel="noopener" aria-label="回總目錄">📚 總目錄</a>
 <div class="ttl">${title}${sub?`<small class="en">${sub}</small>`:""}</div></div>`}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]");if(s){e.preventDefault();speak(s.dataset.say,s.dataset.slow?.6:0);return}
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go)}});
function go(r){clean();document.querySelectorAll(".overlay").forEach(o=>o.remove());window.scrollTo(0,0);
  const p=r.split(":");if(p[0]==="home")showHome();else if(p[0]==="topic")showTopic(p[1]);else if(p[0]==="level")playLevel(p[1],p[2])}

function stopsFor(N){return Array.from({length:N},(_,i)=>[i%2?72:28,5+(i+.6)*(84/N)])}
function mapHTML(t){const N=t.levels.length,H=N*190+120,P=stopsFor(N).map(([x,y])=>[x,y*(N*190)/H]),pts=P.map(([x,y])=>[x*10,y*H/100]);const C=t.color;
  let d=`M${pts[0][0]},40`;pts.forEach((p,i)=>{const q=i?pts[i-1]:[pts[0][0],40];d+=` C${q[0]},${(q[1]+p[1])/2} ${p[0]},${(q[1]+p[1])/2} ${p[0]},${p[1]}`});
  const last=pts[N-1],gx=500,gy=H-70;d+=` C${last[0]},${(last[1]+gy)/2} ${gx},${(last[1]+gy)/2} ${gx},${gy}`;
  let gold='';for(let i=1;i<N;i++){if(isDone(t.id,t.levels[i-1])&&isDone(t.id,t.levels[i])){const q=pts[i-1],p=pts[i];gold+=`<path d="M${q[0]},${q[1]} C${q[0]},${(q[1]+p[1])/2} ${p[0]},${(q[1]+p[1])/2} ${p[0]},${p[1]}" fill="none" stroke="#F7C948" stroke-width="16" stroke-linecap="round"/>`}}
  let hills='';const sh=['#BFE6A8','#A8DB92','#9AD285','#B4E09C'];for(let y=150,k=0;y<H;y+=300,k++){const a=40+(k%3)*25;hills+=`<path d="M0,${y} C200,${y-a} 380,${y+a} 560,${y-a*.6} C740,${y-a*1.4} 880,${y+a*.4} 1000,${y-a*.3} L1000,${H} L0,${H} Z" fill="${sh[k%4]}"/><path d="M0,${y} C200,${y-a} 380,${y+a} 560,${y-a*.6} C740,${y-a*1.4} 880,${y+a*.4} 1000,${y-a*.3} L1000,${H} L0,${H} Z" fill="${C}" opacity=".06"/>`}
  const tree=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-5" y="0" width="10" height="26" fill="#8A5A3B"/><circle cx="0" cy="-8" r="24" fill="#4E9A3A"/><circle cx="-12" cy="2" r="16" fill="#5DB046"/><circle cx="13" cy="0" r="17" fill="#3F8A30"/><circle cx="-6" cy="-14" r="7" fill="#7CC765" opacity=".8"/></g>`;
  const pine=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-4" y="10" width="8" height="16" fill="#7A4E2E"/><path d="M0,-40 L22,-6 L12,-6 L28,14 L-28,14 L-12,-6 L-22,-6 Z" fill="#2F7D4A"/><path d="M0,-40 L10,-24 L0,-20 Z" fill="#4FA36A"/></g>`;
  const house=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-26" y="-14" width="52" height="34" fill="#FFF3DA" stroke="#C99A5A" stroke-width="2"/><path d="M-34,-12 L0,-40 L34,-12 Z" fill="${C}"/><rect x="-7" y="2" width="14" height="18" fill="#9B6A3F"/><rect x="12" y="-6" width="10" height="10" fill="#BFE5F2" stroke="#C99A5A" stroke-width="1.5"/></g>`;
  const flowers=(x,y)=>[0,1,2,3].map(i=>`<g transform="translate(${x+i*16-24},${y+(i%2)*8})"><line x1="0" y1="0" x2="0" y2="12" stroke="#4E9A3A" stroke-width="2"/><circle r="5" fill="${['#FF8FA3','#FFD54A','#FFFFFF','#C49BFF'][i]}"/><circle r="2" fill="#F59E0B"/></g>`).join('');
  const rock=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="22" ry="12" fill="#B9BFC4"/><ellipse cx="${x-6}" cy="${y-4}" rx="9" ry="4" fill="#D5DADE"/>`;
  const KIT=[tree,pine,house,tree,pine];let scen='';
  P.forEach(([x,y],i)=>{const yy=y*H/100,side=x>50?[90,175]:[825,910];const f=KIT[i%KIT.length];scen+=f(side[0],yy-10,1)+f(side[1],yy+38,.75)+(i%2?flowers(x>50?140:860,yy+90):rock(x>50?150:850,yy+92))});
  const sky=`<rect width="1000" height="${H}" fill="url(#tg)"/><rect width="1000" height="170" fill="url(#ts)"/><circle cx="890" cy="70" r="40" fill="#FFE27A"/><circle cx="890" cy="70" r="56" fill="#FFE27A" opacity=".3"/>`+[[150,60,1],[420,90,.8],[700,50,.9]].map(([x,y,s])=>`<g transform="translate(${x},${y}) scale(${s})" fill="#fff" opacity=".95"><ellipse cx="0" cy="0" rx="46" ry="20"/><ellipse cx="-28" cy="8" rx="30" ry="15"/><ellipse cx="30" cy="8" rx="34" ry="16"/></g>`).join('');
  const sign=`<g transform="translate(${pts[0][0]>500?pts[0][0]-150:pts[0][0]+150},70)"><rect x="-5" y="-4" width="10" height="70" fill="#8A5A3B"/><rect x="-78" y="-24" width="156" height="44" rx="8" fill="#C98A4B" stroke="#8A5A3B" stroke-width="4"/><text y="6" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" font-family="sans-serif">出發 START</text></g>`;
  const all=allDone(t.id);
  const castle=`<g transform="translate(${gx},${gy})"><rect x="-90" y="-50" width="180" height="70" fill="#F4E7CF" stroke="#B08A55" stroke-width="4"/><rect x="-110" y="-90" width="44" height="110" fill="#EADBBE" stroke="#B08A55" stroke-width="4"/><rect x="66" y="-90" width="44" height="110" fill="#EADBBE" stroke="#B08A55" stroke-width="4"/>${[-110,-99,-88,-77,66,77,88,99].map(x=>`<rect x="${x}" y="-102" width="8" height="12" fill="#EADBBE" stroke="#B08A55" stroke-width="2"/>`).join('')}<path d="M-22,20 L-22,-12 Q0,-34 22,-12 L22,20 Z" fill="#8A5A3B"/><line x1="-88" y1="-90" x2="-88" y2="-150" stroke="#6B4A22" stroke-width="4"/><path d="M-88,-150 L-48,-138 L-88,-126 Z" fill="${C}"/><line x1="88" y1="-90" x2="88" y2="-150" stroke="#6B4A22" stroke-width="4"/><path d="M88,-150 L128,-138 L88,-126 Z" fill="${C}"/><rect x="-70" y="-84" width="140" height="30" rx="6" fill="${C}"/><text y="-62" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="sans-serif">${all?'🏆 全部過關':'終點 GOAL'}</text></g>`;
  const nxt=t.levels.findIndex(l=>!isDone(t.id,l));
  return `<div class="map tmap2" style="aspect-ratio:1000/${H}">
   <svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7F1C8"/><stop offset="1" stop-color="#B7E3A3"/></linearGradient><linearGradient id="ts" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FDDF7"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></linearGradient></defs>
    ${sky}${hills}${scen}${sign}

    <path d="${d}" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="22 20" stroke-linecap="round" opacity=".9"/>${castle}</svg>

function finishLevel(t,lv,ok,msg){const was=allDone(t.id);if(ok)mark(t.id,lv);const now=allDone(t.id);
  const i=t.levels.indexOf(lv);const nx=t.levels.slice(i+1).find(l=>!isDone(t.id,l))||t.levels.find(l=>!isDone(t.id,l))||t.levels[i+1];

const head=(a,b)=>`<div class="qhead"><span>${a}</span><span>${b}</span></div>`;

/* 1 認識圖鑑：目錄＋左右滑動 */
function lvLearn(t,body){const n=t.items.length;const order=t.cats.flatMap(c=>t.items.map((_,i)=>i).filter(i=>t.items[i].c===c.id));S.prog[t.id]=S.prog[t.id]||{};const seen=new Set(S.prog[t.id]._seen||[]);
  const markSeen=i=>{if(!seen.has(i)){seen.add(i);S.prog[t.id]._seen=[...seen];save();
    if(seen.size===n&&!isDone(t.id,"learn"))later(()=>finishLevel(t,"learn",true,`你看完了全部 ${n} 張「${t.zh}」圖鑑！接著用遊戲來複習吧。`),700)}};
  const grid=()=>{window.scrollTo(0,0);
    body.innerHTML=`<div class="lhead"><b>📚 圖鑑目錄</b><span>已看 ${seen.size} / ${n}</span></div><div class="pbar"><i style="width:${seen.size/n*100}%"></i></div>
     <p class="note">點任何一張卡片開始看，卡片可以左右滑動換頁；全部看過就過關。</p>`+
     t.cats.map(c=>{const its=t.items.map((it,i)=>[it,i]).filter(([it])=>it.c===c.id);if(!its.length)return"";
      return `<div class="gcat">${c.e} ${c.zh} <span class="en">${c.en}</span></div><div class="lgrid">${its.map(([it,i])=>`<button class="ltile ${seen.has(i)?"seen":""}" data-i="${i}">${seen.has(i)?'<span class="ok">✓</span>':""}<span class="e">${it.e}</span><b>${it.zh}</b><span class="en">${it.en}</span></button>`).join("")}</div>`}).join("");
    body.querySelectorAll(".ltile").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;card(i);speak(t.items[i].en)})};
  const card=(i,dir)=>{const pos=order.indexOf(i),it=t.items[i],cat=catOf(t,it.c);window.scrollTo(0,0);markSeen(i);
    const tags=t.ind?`<span class="tag">📍 ${it.place}</span><span class="tag">🎉 ${it.pz}</span>`:`<span class="tag">${cat.e} ${cat.zh}</span>${it.yl?`<span class="tag">⏳ ${it.yl}</span>`:""}`;
    body.innerHTML=`<div class="lnav"><button class="btn sm" id="toc">📚 圖鑑目錄</button><span>第 ${pos+1} / ${n} 張・已看 ${seen.size}</span></div>
     <div class="lcard ${dir?"slide"+dir:""}" id="lc"><div class="big">${it.e}</div><div class="word en">${it.en} ${say(it.en)}</div><div class="zhw">${it.zh}</div>
     <div class="tags">${tags}</div>${t.ind?`<div class="fest en">🎉 ${it.pen} ${say(it.pen)}</div>`:""}
     <div class="desc"><p class="en">${it.d} ${say(it.d)}</p><p>${it.dz}</p></div>
     ${t.ind?`<div class="objs"><div class="otitle">🏺 代表文物與文化 <span class="en">Culture & objects</span></div>${it.obj.map(o=>`<div class="orow"><span class="oe">${o.e}</span><div><b>${o.zh}</b><br><span class="en">${o.en}</span> ${say(o.en)}<div class="ox">${o.x}</div></div></div>`).join("")}</div>`:""}</div>
     <div class="dots">${order.map(k=>`<i class="${k===i?"cur":seen.has(k)?"on":""}"></i>`).join("")}</div>
     <p class="note" style="text-align:center">👈 左右滑動卡片換頁 👉</p>
     <div class="navrow"><button class="btn" id="pv" ${pos===0?'disabled style="opacity:.4"':""}>◀ 上一張</button>
     <button class="btn pri" id="nx">${pos===n-1?"📚 回目錄":"下一張 ▶"}</button></div>`;
    const to=(p,d)=>{if(p<0||p>=n)return;const k=order[p];card(k,d);speak(t.items[k].en)};
    $("#toc").onclick=grid;$("#pv").onclick=()=>to(pos-1,"R");$("#nx").onclick=()=>pos===n-1?grid():to(pos+1,"L");
    const lc=$("#lc");let st=null;
    lc.addEventListener("pointerdown",e=>{st={x:e.clientX,y:e.clientY}});
    lc.addEventListener("pointercancel",()=>{st=null});
    lc.addEventListener("pointerup",e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;st=null;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){if(dx<0)to(pos+1,"L");else to(pos-1,"R")}});
  };
  grid();
}

/* 2 問答挑戰 */
function lvQuiz(t,body){const N=8,PASS=6;
  const qs=shuffle(t.items).slice(0,N).map((it,k)=>({it,type:k%2,opts:pickOpts(t,it)}));let qi=0,sc=0,lock=false;
  const draw=()=>{const q=qs[qi],it=q.it;lock=false;
    body.innerHTML=head(`第 ${qi+1} / ${N} 題`,`⭐ ${sc}`)+`<div class="qbox">${q.type===0?`<div class="q en">${it.d} ${say(it.d)}</div><div class="q">${it.dz}</div><div class="ask">這是哪一個？<span class="en"> Which one is it?</span></div>`
       :`<div class="big">${it.e}</div><div class="zhw">${it.zh}</div><div class="ask">英文怎麼說？<span class="en"> What is it in English?</span></div>`}</div>
     <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${q.type===0?`${o.e} <span class="en">${o.en}</span>｜${o.zh}`:`<span class="en">${o.en}</span>`}</button>`).join("")}</div><div id="fb"></div>`;
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const right=q.opts[+b.dataset.k]===it;if(right)sc++;
      body.querySelectorAll(".opt").forEach(x=>{if(q.opts[+x.dataset.k]===it)x.classList.add("good");else if(x===b)x.classList.add("wrong")});speak(it.en);
      $("#fb").innerHTML=`<div class="fb">${right?"✅ 答對了！":"❌ 正確答案是："}<br>${it.e} <span class="en big2">${it.en}</span> ${say(it.en)}｜${it.zh}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"quiz",sc>=PASS,`答對 ${sc} / ${N} 題${sc>=PASS?"，太厲害了！":`，答對 ${PASS} 題就能過關。`}`)}});
  };draw();
}

function lvListen(t,body){const N=8,PASS=6;const qs=shuffle(t.items).slice(0,N).map(it=>({it,opts:pickOpts(t,it)}));let qi=0,sc=0,lock=false;

      $("#fb").innerHTML=`<div class="fb">${right?"✅ 聽對了！":"❌ 剛剛唸的是："}<br>${it.e} <span class="en big2">${it.en}</span> ${say(it.en)}｜${it.zh}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"listen",sc>=PASS,`聽對 ${sc} / ${N} 題${sc>=PASS?"，耳朵真靈！":`，聽對 ${PASS} 題就能過關。`}`)}});

/* 4 拼字高手 */
function spWord(it){if(it.sp===null)return null;if(!it.sp&&/'/.test(it.en))return null;const w=(it.sp||it.en.split(" ").pop()).toLowerCase().replace(/[^a-z]/g,"");return w.length>=3&&w.length<=12?w:null}
function lvSpell(t,body){const pool=shuffle(t.items.filter(spWord));const N=Math.min(6,pool.length),PASS=Math.ceil(N*.67);let qi=0,sc=0;
  const draw=()=>{const it=pool[qi],w=spWord(it);let typed=[];
    const re=new RegExp(w,"i");const src=[it.en,it.d].find(s=>re.test(s.replace(/'/g,"")));
    const hint=src?esc(src.replace(re,"＿".repeat(w.length))):"";
    const AZ="abcdefghijklmnopqrstuvwxyz";const decoy=[];while(decoy.length<2){const c=AZ[Math.floor(Math.random()*26)];if(!w.includes(c))decoy.push(c)}
    const tiles=shuffle([...w.split(""),...decoy]).map((c,i)=>({c,i,used:false}));
    body.innerHTML=head(`第 ${qi+1} / ${N} 字`,`⭐ ${sc}`)+`<div class="qbox"><div class="big">${it.e}</div><div class="zhw">${it.zh}</div>
      ${hint&&!t.ind?`<div class="q en">${hint}</div>`:""}<div class="ask">拼出英文單字 <span class="en">Spell the word</span>（${w.length} 個字母）</div>
      <div class="slots" id="sl"></div></div><div class="tiles" id="tl"></div>
      <div class="navrow"><button class="btn" id="bk">⌫ 刪除</button><button class="btn" id="hn">💡 聽發音</button></div><div id="fb"></div>`;
    const rs=()=>{$("#sl").innerHTML=Array.from({length:w.length},(_,k)=>`<span class="slot">${typed[k]?typed[k].c.toUpperCase():""}</span>`).join("");
      $("#tl").innerHTML=tiles.map(x=>`<button class="tile" data-i="${x.i}" ${x.used?"disabled":""}>${x.c.toUpperCase()}</button>`).join("");
      $("#tl").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const x=tiles[+b.dataset.i];if(x.used||typed.length>=w.length)return;x.used=true;typed.push(x);rs();if(typed.length===w.length)check()})};
    $("#bk").onclick=()=>{const x=typed.pop();if(x){x.used=false;rs()}};
    $("#hn").onclick=()=>speak(w,.6);
    const check=()=>{const ans=typed.map(x=>x.c).join(""),right=ans===w;if(right)sc++;
      $("#sl").classList.add(right?"okk":"bad");$("#tl").innerHTML="";$("#bk").disabled=true;speak(it.en);
      $("#fb").innerHTML=`<div class="fb">${right?"✅ 拼對了！":"❌ 正確拼法："}<br><span class="en big2">${w.toUpperCase()}</span>｜${it.e} <span class="en">${it.en}</span> ${say(it.en)}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"spell",sc>=PASS,`拼對 ${sc} / ${N} 個字${sc>=PASS?"，拼字高手就是你！":`，拼對 ${PASS} 個就能過關。`}`)}};
    rs();
  };draw();
}

/* 5 是非判斷 */
function lvTF(t,body){const qs=shuffle(t.tf).slice(0,8),N=qs.length,PASS=Math.ceil(N*.75);let qi=0,sc=0,lock=false;
  const draw=()=>{const q=qs[qi];lock=false;
    body.innerHTML=head(`第 ${qi+1} / ${N} 題`,`⭐ ${sc}`)+`<div class="qbox"><div class="ask">這句話對不對？ <span class="en">True or false?</span></div>
      <div class="stmt en">${q.s} ${say(q.s)}</div><div class="q">${q.z}</div></div>
      <div class="tfrow"><button class="tfb" data-a="1">⭕<br>對 True</button><button class="tfb" data-a="0">❌<br>錯 False</button></div><div id="fb"></div>`;
    body.querySelectorAll(".tfb").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const right=(b.dataset.a==="1")===q.a;if(right)sc++;
      b.classList.add(right?"good":"wrong");speak(q.s);
      $("#fb").innerHTML=`<div class="fb">${right?"✅ 答對了！":"❌ 再想想！"}<br>${q.x}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"tf",sc>=PASS,`答對 ${sc} / ${N} 題${sc>=PASS?"，判斷力一流！":`，答對 ${PASS} 題就能過關。`}`)}});
  };draw();
}

/* 6 分類大師／分布地圖 */
function lvSort(t,body){const its=shuffle(t.items).slice(0,Math.min(10,t.items.length)),N=its.length,PASS=Math.ceil(N*.75);let qi=0,sc=0,lock=false;
  const draw=()=>{const it=its[qi];lock=false;
    body.innerHTML=head(`第 ${qi+1} / ${N} 個`,`⭐ ${sc}`)+`<div class="qbox"><div class="big">${it.e}</div><div class="word en">${it.en} ${say(it.en)}</div><div class="zhw">${it.zh}</div>
      <div class="ask">${t.sortTitle}</div></div><div class="bins">${t.cats.map(c=>`<button class="bin" data-c="${c.id}"><span>${c.e}</span>${c.zh}<small class="en">${c.en}</small></button>`).join("")}</div><div id="fb"></div>`;
    body.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const right=b.dataset.c===it.c;if(right)sc++;
      body.querySelectorAll(".bin").forEach(x=>{if(x.dataset.c===it.c)x.classList.add("good");else if(x===b)x.classList.add("wrong")});speak(it.en);const c=catOf(t,it.c);
      $("#fb").innerHTML=`<div class="fb">${right?"✅ 分對了！":"❌ 應該放在："}${c.e} ${c.zh}${t.ind?`<div class="note">${it.zh}主要分布：${it.place}</div>`:""}${nextBtn(qi===N-1)}</div>`;
      $("#nq").onclick=()=>{if(qi<N-1){qi++;draw();window.scrollTo(0,0)}else finishLevel(t,"sort",sc>=PASS,`分對 ${sc} / ${N} 個${sc>=PASS?"，分類高手！":`，分對 ${PASS} 個就能過關。`}`)}});

/* 7 時光排序（歷史） */
function lvTimeline(t,body){const ev=shuffle(t.items).slice(0,6),order=ev.slice().sort((a,b)=>a.y-b.y);let k=0,miss=0;
  const draw=()=>{body.innerHTML=`<div class="qbox"><div class="ask">從最早到最晚，依序點選事件！<br><span class="en">Tap the events from earliest to latest.</span></div><div class="note">錯誤 ${miss} 次（錯 2 次以內過關）</div></div>
    <div class="tl">${order.slice(0,k).map(it=>`<div class="tli"><span class="yr">${it.yl}</span><span>${it.e} ${it.zh}</span><span class="en">${it.en}</span></div>`).join("")||'<div class="note" style="text-align:center">時間軸從這裡開始 ⬇️</div>'}</div>
    <div class="opts">${shuffle(ev.filter(x=>order.indexOf(x)>=k)).map(it=>`<button class="opt" data-i="${ev.indexOf(it)}">${it.e} <b>${it.zh}</b>｜<span class="en">${it.en}</span></button>`).join("")}</div>`;
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const it=ev[+b.dataset.i];
      if(it===order[k]){k++;speak(it.en);toast(`⏳ ${it.yl}｜${it.zh}`);if(k===order.length){draw();later(()=>finishLevel(t,"timeline",miss<=2,`錯誤 ${miss} 次${miss<=2?"，時間感超強！":"，錯 2 次以內就能過關。"}`),600)}else draw()}
      else{miss++;b.classList.add("shake","wrong");toast("還有更早發生的事件喔！");later(()=>{b.classList.remove("shake","wrong")},500);body.querySelector(".note").textContent=`錯誤 ${miss} 次（錯 2 次以內過關）`}});
  };draw();
}

/* 8 族群偵探（原住民） */
function lvDetective(t,body){const N=6,PASS=10;const qs=shuffle(t.items).slice(0,N).map(it=>({it,opts:pickOpts(t,it)}));let qi=0,sc=0;
  const draw=()=>{const q=qs[qi],it=q.it;let shown=1,done=false;
    const rc=()=>{$("#cl").innerHTML=it.clues.slice(0,shown).map((c,i)=>`<div class="clue"><b>線索 ${i+1}</b> <span class="en">${c[0]}</span> ${say(c[0])}<div>${c[1]}</div></div>`).join("")+(shown<3&&!done?`<div class="note">答錯會多給一條線索，越早猜中分數越高（3／2／1 分）</div>`:"")};
    body.innerHTML=head(`第 ${qi+1} / ${N} 案`,`⭐ ${sc} 分`)+`<div class="qbox"><div class="big">🔍</div><div class="ask">猜猜看，這是哪一族？ <span class="en">Which people is it?</span></div><div id="cl"></div></div>
     <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.e} <b>${o.zh}</b>｜<span class="en">${o.en}</span></button>`).join("")}</div><div id="fb"></div>`;rc();
    const reveal=pts=>{done=true;shown=3;rc();sc+=pts;speak(it.en);body.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k]===it)x.classList.add("good")});

/* 10 消消樂 */
function lvMatch3(t,body){const N=7,K=6,GOAL=300,MOVES=20;const types=shuffle(t.items).slice(0,K);
  let g=[],score=0,moves=MOVES,busy=false,sel=-1,hintId=null,ended=false;
  body.innerHTML=`<div class="stat"><span>🎯 目標 <b>${GOAL}</b></span><span>⭐ 分數 <b id="sc">0</b></span><span>👣 剩餘 <b id="mv">${MOVES}</b> 步</span></div>
   <div class="chips">${types.map(x=>`<button class="chip" data-say="${esc(x.en)}">${x.e} ${x.zh} 🔊</button>`).join("")}</div>
   <div class="board" id="bd"></div><p class="tip">點兩個相鄰圖案交換，或直接滑動；3 個以上連成一線就消除！10 秒沒動作會亮出提示。</p>`;
  const bd=$("#bd"),rnd=()=>Math.floor(Math.random()*K),sw=(a,b)=>{const x=g[a];g[a]=g[b];g[b]=x};
  const adj=(a,b)=>(Math.abs(a-b)===1&&Math.floor(a/N)===Math.floor(b/N))||Math.abs(a-b)===N;
  function matches(){const s=new Set();
    for(let r=0;r<N;r++){let c=0;while(c<N){const v=g[r*N+c];let e=c;while(e+1<N&&v>=0&&g[r*N+e+1]===v)e++;if(v>=0&&e-c>=2)for(let k=c;k<=e;k++)s.add(r*N+k);c=e+1}}
    for(let c=0;c<N;c++){let r=0;while(r<N){const v=g[r*N+c];let e=r;while(e+1<N&&v>=0&&g[(e+1)*N+c]===v)e++;if(v>=0&&e-r>=2)for(let k=r;k<=e;k++)s.add(k*N+c);r=e+1}}return s}
  function findMove(){for(let i=0;i<N*N;i++)for(const j of [i%N<N-1?i+1:-1,i+N<N*N?i+N:-1]){if(j<0)continue;sw(i,j);const m=matches().size;sw(i,j);if(m)return[i,j]}return null}
  function gen(){do{g=[];for(let i=0;i<N*N;i++){let v;do{v=rnd()}while((i%N>=2&&g[i-1]===v&&g[i-2]===v)||(i>=2*N&&g[i-N]===v&&g[i-2*N]===v));g.push(v)}}while(!findMove())}
  function draw(cls={}){bd.innerHTML=g.map((v,i)=>`<div class="cell ${cls[i]||""} ${i===sel?"sel":""}" data-i="${i}">${v>=0?types[v].e:""}</div>`).join("")}
  const upd=()=>{$("#sc").textContent=score;$("#mv").textContent=moves};
  function armHint(){clearTimeout(hintId);hintId=setTimeout(()=>{if(busy||ended)return;const m=findMove();if(m)m.forEach(i=>bd.children[i]&&bd.children[i].classList.add("hint"))},10000)}
  cleanups.push(()=>clearTimeout(hintId));
  async function trySwap(a,b){if(busy||ended||!adj(a,b))return;busy=true;sel=-1;clearTimeout(hintId);sw(a,b);draw();await wait(140);let m=matches();
    if(!m.size){sw(a,b);draw({[a]:"shake",[b]:"shake"});await wait(320);busy=false;armHint();return}
    moves--;let combo=1,said=false;
    while(m.size){const first=g[[...m][0]];score+=m.size*10*combo;
      if(!said){said=true;const it=types[first];toast(`${it.e} <span class="en">${it.en}</span>｜${it.zh}`);speak(it.en)}else toast(`🔥 連鎖 x${combo}！`,900);
      const c1={};m.forEach(i=>c1[i]="pop");draw(c1);upd();await wait(270);m.forEach(i=>g[i]=-1);const fr={};
      for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--){const v=g[r*N+c];if(v>=0){if(w!==r){g[w*N+c]=v;fr[w*N+c]="drop"}w--}}for(let r=w;r>=0;r--){g[r*N+c]=rnd();fr[r*N+c]="drop"}}
      draw(fr);await wait(260);m=matches();combo++}
    upd();
    if(score>=GOAL){ended=true;later(()=>finishLevel(t,"match3",true,`得分 ${score}，還剩 ${moves} 步！`),500);return}
    if(moves<=0){ended=true;later(()=>finishLevel(t,"match3",false,`得分 ${score}，目標是 ${GOAL} 分，再接再厲！`),500);return}
    if(!findMove()){toast("沒有可交換的組合，重新洗牌！");await wait(700);gen();draw()}
    busy=false;armHint()}
  let st=null;
  bd.addEventListener("pointerdown",e=>{const c=e.target.closest(".cell");if(!c)return;st={i:+c.dataset.i,x:e.clientX,y:e.clientY};try{bd.setPointerCapture(e.pointerId)}catch(_){}});
  bd.addEventListener("pointerup",e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y,i=st.i;st=null;if(busy||ended)return;
    if(Math.max(Math.abs(dx),Math.abs(dy))>22){let j;if(Math.abs(dx)>Math.abs(dy))j=dx>0?(i%N<N-1?i+1:-1):(i%N>0?i-1:-1);else j=dy>0?(i+N<N*N?i+N:-1):(i-N>=0?i-N:-1);if(j>=0)trySwap(i,j);return}
    if(sel<0){sel=i;draw()}else if(sel===i){sel=-1;draw()}else if(adj(sel,i))trySwap(sel,i);else{sel=i;draw()}});
  bd.addEventListener("pointercancel",()=>{st=null});
  gen();draw();armHint();
}

function lvCollectPlay(t,body){const GOAL=8,TIME=60;let got=0,time=TIME,ended=false,items=[],acc=0,last=performance.now(),raf,target=null;
  body.innerHTML=`<div class="stat"><span>⏱️ 時間 <b id="tm">${TIME}</b> 秒</span><span>🧺 收集 <b id="gt">0</b> / ${GOAL}</span></div>
   <div class="target" id="tg"></div><div class="arena" id="ar"></div><div class="basket" id="bk"><span class="lb">我的籃子</span></div>
   <p class="tip">看英文找圖案！點對就收進籃子；點錯會扣 3 秒。</p>`;
  const ar=$("#ar"),rand=()=>t.items[Math.floor(Math.random()*t.items.length)];
  const newTarget=()=>{let n;do{n=rand()}while(n===target&&t.items.length>1);target=n;setTimeout(()=>tgSwap(got?`🔄 換新目標！<small>New target: ${n.en}</small>`:`🎯 開始！<small>Find: ${n.en}</small>`),0);
    $("#tg").innerHTML=`<span class="lbl">找找看 Find:</span><span class="en">${n.en}</span> ${say(n.en)}<div class="zs">（${n.zh}）</div><div class="hint3">💡 提示：找這個圖案 <span class="he">${n.e}</span></div>`};
  function floatTxt(x,y,txt,col){const f=document.createElement("div");f.className="float";f.style.left=Math.max(0,Math.min(x-20,ar.clientWidth-150))+"px";f.style.top=Math.max(0,y)+"px";f.style.color=col;f.innerHTML=txt;ar.appendChild(f);setTimeout(()=>f.remove(),900)}
  function spawn(){const W=ar.clientWidth,it=Math.random()<.5?target:rand();const el=document.createElement("button");el.className="fall";el.innerHTML=it.e;el.setAttribute("aria-label",it.zh);
    const o={it,el,x:Math.random()*Math.max(10,W-70),y:-70,v:48+Math.random()*30+(TIME-time)*.5};el.style.transform=`translate(${o.x}px,${o.y}px)`;
    el.addEventListener("pointerdown",ev=>{ev.preventDefault();hit(o)});ar.appendChild(el);items.push(o)}
  function hit(o){if(ended||o.dead)return;
    if(o.it===target){o.dead=true;got++;o.el.remove();floatTxt(o.x,o.y,`+1 ${o.it.en}`,"var(--ok)");speak(o.it.en);
      $("#bk").insertAdjacentHTML("beforeend",`<span title="${esc(o.it.zh)}">${o.it.e}</span>`);$("#gt").textContent=got;if(got>=GOAL){end(true);return}newTarget()}
    else{o.dead=true;time=Math.max(0,time-3);o.el.classList.add("wrong");floatTxt(o.x,o.y,`−3 秒｜那是 ${o.it.zh}`,"var(--bad)");setTimeout(()=>o.el.remove(),300)}}
  function end(ok){if(ended)return;ended=true;cancelAnimationFrame(raf);later(()=>finishLevel(t,"collect",ok,ok?`你收集了 ${GOAL} 個圖案！`:`時間到！收集了 ${got} / ${GOAL} 個。`),400)}
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(ended)return;time-=dt;acc+=dt;if(acc>.95){acc=0;spawn()}
    const H=ar.clientHeight;items=items.filter(o=>{if(o.dead)return false;o.y+=o.v*dt;if(o.y>H){o.el.remove();return false}o.el.style.transform=`translate(${o.x}px,${o.y}px)`;return true});
    $("#tm").textContent=Math.max(0,Math.ceil(time));if(time<=0){end(false);return}raf=requestAnimationFrame(loop)}
  cleanups.push(()=>{ended=true;cancelAnimationFrame(raf)});newTarget();spawn();raf=requestAnimationFrame(loop);
}

lvCollect=function(t,body){const d=TP_BIG[Math.floor(Math.random()*TP_BIG.length)];

function tpCollectPlay(t,body){const GOAL=8,TIME=60;let got=0,inRound=0,time=TIME,ended=false,items=[],acc=0,last=performance.now(),raf,dist=null;
  body.innerHTML=`<div class="stat"><span>⏱️ 時間 <b id="tm">${TIME}</b> 秒</span><span>🧺 收集 <b id="gt">0</b> / ${GOAL}</span></div>
   <div class="target" id="tg"></div><div class="arena" id="ar"></div><div class="basket" id="bk"><span class="lb">我的籃子</span></div>
   <p class="tip">只點屬於指定行政區的景點！點錯扣 3 秒。</p>`;
  const ar=$("#ar");
  const newDist=()=>{let n;do{n=TP_BIG[Math.floor(Math.random()*TP_BIG.length)]}while(n===dist);dist=n;inRound=0;setTimeout(()=>tgSwap(got?`🔄 換區了！<small>現在收集：${n.zh} ${n.en}</small>`:`🎯 開始！<small>收集：${n.zh} ${n.en}</small>`),0);
    $("#tg").innerHTML=`<span class="lbl">收集 Collect:</span><span class="en">${dist.en}</span> ${say(dist.en)}<div class="zs">（${dist.zh}的景點）</div>`;speak(dist.en)};
  function floatTxt(x,y,txt,col){const f=document.createElement("div");f.className="float";f.style.left=Math.max(0,Math.min(x-20,ar.clientWidth-170))+"px";f.style.top=Math.max(0,y)+"px";f.style.color=col;f.innerHTML=txt;ar.appendChild(f);setTimeout(()=>f.remove(),1100)}
  function spawn(){const W=ar.clientWidth,pool=Math.random()<.45?TP_S.filter(s=>s.d===dist.id):TP_S,it=pool[Math.floor(Math.random()*pool.length)];
    const el=document.createElement("button");el.className="fall chipf";el.innerHTML=`${it.e} ${it.zh}`;el.setAttribute("aria-label",it.zh);
    const o={it,el,x:Math.random()*Math.max(10,W-150),y:-50,v:50+Math.random()*35+(TIME-time)*.6};el.style.transform=`translate(${o.x}px,${o.y}px)`;
    el.addEventListener("pointerdown",ev=>{ev.preventDefault();hit(o)});ar.appendChild(el);items.push(o)}
  function hit(o){if(ended||o.dead)return;o.dead=true;
    if(o.it.d===dist.id){got++;inRound++;o.el.remove();floatTxt(o.x,o.y,`+1 ${o.it.zh}`,"var(--ok)");speak(o.it.en);
      $("#bk").insertAdjacentHTML("beforeend",`<span title="${esc(o.it.zh)}">${o.it.e}</span>`);$("#gt").textContent=got;if(got>=GOAL){end(true);return}if(inRound>=3)newDist()}
    else{time=Math.max(0,time-3);o.el.classList.add("wrong");floatTxt(o.x,o.y,`−3 秒｜${o.it.zh}在${TPD(o.it.d).zh}`,"var(--bad)");setTimeout(()=>o.el.remove(),300)}}
  function end(ok){if(ended)return;ended=true;cancelAnimationFrame(raf);later(()=>finishLevel(t,"collect",ok,ok?`你收集了 ${GOAL} 個景點！`:`時間到！收集了 ${got} / ${GOAL} 個。`),400)}
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(ended)return;time-=dt;acc+=dt;if(acc>.9){acc=0;spawn()}
    const H=ar.clientHeight;items=items.filter(o=>{if(o.dead)return false;o.y+=o.v*dt;if(o.y>H){o.el.remove();return false}o.el.style.transform=`translate(${o.x}px,${o.y}px)`;return true});
    $("#tm").textContent=Math.max(0,Math.ceil(time));if(time<=0){end(false);return}raf=requestAnimationFrame(loop)}
  cleanups.push(()=>{ended=true;cancelAnimationFrame(raf)});newDist();spawn();raf=requestAnimationFrame(loop);
}

  zh:"1700 年以前，盆地是說凱達格蘭語的巴賽人的家園。1700 年代漢人來到河邊建立艋舺；1853 年頂下郊拚後，同安人北遷建立大稻埕，1860 年淡水開港，大稻埕靠茶葉致富。1884 年清朝築好有五座城門的台北城——臺北的第三個市街。"},

(()=>{if(window.SFX)return;let ctx=null;
 function ac(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume()}catch(e){}return ctx}
 function tone(f,t0,d,type,vol){const c=ac();if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05)}
 const S={ok(){tone(784,0,.13,"sine",.2);tone(1175,.1,.24,"sine",.2)},bad(){tone(233,0,.16,"square",.07);tone(175,.13,.28,"square",.07)},next(){tone(988,0,.1,"triangle",.12);tone(988,.13,.1,"triangle",.12)}};
 let pend=null,lastT=0;
 function flag(k){if(pend===null){pend=k;setTimeout(()=>{const k2=pend;pend=null;const n=Date.now();if(n-lastT<120)return;lastT=n;(window.__sfxLog||[]).push(k2);try{S[k2]()}catch(e){}},25)}else if(k==="bad")pend="bad"}
 window.SFX={ok:()=>flag("ok"),bad:()=>flag("bad"),next:()=>{try{S.next()}catch(e){}}};
 ["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,ac,{capture:true,passive:true}));
 const OK=/(^|\s)(good|right|correct)(\s|$)/,BAD=/(^|\s)(wrong|bad|shake|hurt|incorrect)(\s|$)/;
 const skip=el=>el.closest&&el.closest("#zz-ov,#ll-ov,.zz-dock,#zz-dock,.ll-ov,header,.bar,.top");
 function scan(n){const cls=typeof n.className==="string"?n.className:"",t=(n.textContent||"").trim();
  if(n.classList&&n.classList.contains("float")){const col=n.style.color||"";if(/bad/.test(col)||/^[−-]/.test(t))return"bad";if(/ok/.test(col)||/^\+/.test(t))return"ok";return null}
  const fb=n.matches&&n.matches(".fb,.msg,.feedback")?n:(n.querySelector&&n.querySelector(".fb,.feedback"));
  if(fb){const ft=(fb.textContent||"").trim(),fc=typeof fb.className==="string"?fb.className:"";
   if(/^(❌|✗|✖)/.test(ft)||/(^|\s)bad(\s|$)/.test(fc))return"bad";if(/^(✅|✔|✓|🎉)/.test(ft)||/(^|\s)ok(\s|$)/.test(fc))return"ok"}
  if(n.querySelector){if(n.querySelector(".wrong"))return"bad";if(n.querySelector(".right,.correct"))return"ok"}
  if(BAD.test(cls))return"bad";if(OK.test(cls))return"ok";return null}
 const start=()=>new MutationObserver(ms=>{for(const m of ms){
   if(m.type==="attributes"){const el=m.target;if(!(el instanceof Element)||skip(el))continue;const now=el.getAttribute("class")||"",old=m.oldValue||"";
     if(BAD.test(now)&&!BAD.test(old))flag("bad");else if(OK.test(now)&&!OK.test(old))flag("ok");

   else for(const n of m.addedNodes){if(!(n instanceof Element)||skip(n))continue;const r=scan(n);if(r)flag(r)}}})
   .observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});
 if(document.body)start();else document.addEventListener("DOMContentLoaded",start);
})();

<script>/*SV*/window.SV_CFG={"topic": "taipei", "head": "一分鐘認識臺北", "headEn": "Taipei in one minute", "scenes": [{"title": "臺北", "sub": "Welcome to Taipei", "big": "topic", "en": "Welcome to Taipei, Taiwan's capital. Old temples, busy night markets and green mountains are all just a metro ride away.", "zh": "歡迎來到臺灣的首都臺北。古老的廟宇、熱鬧的夜市和綠色的山，搭捷運就能到。"}, {"cat": "temple", "items": ["Longshan Temple", "Xiahai City God Temple", "Bao'an Temple"], "en": "Start with the temples. Longshan Temple is the most famous. Visitors pray for love at the tiny City God Temple, and Bao'an Temple won a UNESCO award.", "zh": "從廟宇開始。龍山寺最有名；小小的霞海城隍廟有人專程來求姻緣；保安宮的修復得過聯合國教科文組織的獎。"}, {"cat": "old", "items": ["Dihua Street", "Ximending", "North Gate"], "en": "Walk the old streets. Dihua Street sells tea and dried goods, Ximending is full of young people, and the North Gate still looks the way it did in 1884.", "zh": "走走老街。迪化街賣茶和南北貨，西門町滿是年輕人，北門還保持 1884 年的模樣。"}, {"cat": "modern", "items": ["Taipei 101", "Tuned mass damper", "Taipei Metro"], "en": "Modern Taipei has Taipei 101, with a giant golden ball inside to keep it steady in typhoons. The MRT takes you everywhere — but no eating on board!", "zh": "現代的臺北有台北 101，裡面掛著巨大的金色阻尼器，颱風時讓大樓穩住。捷運帶你到處跑，但車上不能吃東西！"}, {"items": ["Jadeite Cabbage", "Liberty Square"], "en": "At the National Palace Museum, everyone wants to see the Jadeite Cabbage. At Liberty Square, watch the honor guard drill outdoors on the hour.", "zh": "在故宮，大家都想看翠玉白菜；在自由廣場，可以看儀隊整點在戶外操演。"}, {"cat": "nature", "items": ["Beitou Hot Spring Museum", "Thermal Valley", "Xiaoyoukeng"], "en": "Taipei sits next to volcanoes. Soak in Beitou's hot springs, see the steaming Thermal Valley, and smell the sulfur at Xiaoyoukeng on Yangmingshan.", "zh": "臺北旁邊就是火山。到北投泡溫泉、看冒煙的地熱谷，再到陽明山小油坑聞聞硫磺味。"}, {"items": ["Maokong Gondola", "Elephant Mountain"], "en": "Ride the Maokong Gondola to the tea hills, or climb Elephant Mountain for the classic sunset view of Taipei 101.", "zh": "搭貓空纜車上茶山，或爬象山，看台北 101 的經典夕陽。"}, {"cat": "food", "items": ["Oyster omelette", "Pepper bun", "Bubble tea"], "en": "At night, it's time to eat: oyster omelettes, pepper buns from a clay oven, and of course, bubble tea, invented in Taiwan.", "zh": "晚上就是吃的時間：蚵仔煎、炭爐烤的胡椒餅，當然還有臺灣發明的珍珠奶茶。"}, {"title": "開始學習！", "sub": "Let's start!", "big": "🏙️", "en": "Now you know the highlights of Taipei. Let's learn how to show them to visitors in English!", "zh": "現在你已經認識臺北的精華了。我們來學怎麼用英文介紹給遊客吧！"}]};window.MV_AUDIO=Object.assign(window.MV_AUDIO||{},{"Welcome to Taipei, Taiwan's capital. Old temples, busy night markets and green mountains are all just a metro ride away.": "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//NkxAAAAANIAAAAAExBTUVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVUEAMEEIBAUBhBh+TAynkQHB4swR5+KUOEE/xYC+gaf+Q8cY0yZFL//iDy4mX0jT//JErDgGQLA4BcH//6JussEEHAOsZMW////8nC+XyUHANgnhcAsBPoFz/////I8iZJkyOMW8mRcYsZUJ8kzxPk+Rn//////+OAeCsQQ//NkxHwAAANIAUAAAHAo0KhQHALAblwkDYnCEK5OFQzN1RAuRXAgYglAmgKTFrjjNNQRKmnM3vgJhTJ35uFQVrQhPnYm70MCKiI91jI40pLDhiyPp4iODplQyT35mZToz2ja9bqVPEopSTzrycJHF61CeZa1cqKTNO29zynPnSgup4TmNMeuwuKYz9tpNlF7//NkxP8kFDm1nZCAAP/Nv1f/T91KjKbie8JlG4VlUsN0iTWNkNtf80pe8/MwLOmUR8WCrZPxWM3Vb0J4y2tWIdGT4zot1CqfW/57budN736921973/KdFB6rbHECE44h2jUVXo8OtYJssVYQkO function add(){const app=document.getElementById("app");if(!app||app.querySelector(".btp"))return;const ref=app.querySelector(".intro");if(!ref||!app.querySelector(".sk-card"))return;ref.insertAdjacentHTML("afterend",html())}
let cur=0,lb=null,tx0=null;
function show(i){cur=Math.max(0,Math.min(P.length-1,i));const p=P[cur];
 lb.querySelector(".fig img").src="img/"+p.f+".jpg";lb.querySelector(".fig img").alt=p.zh;
 lb.querySelector(".ct").textContent=(cur+1)+" / "+P.length;
 lb.querySelector(".pl").textContent=p.pl+" "+p.pe;lb.querySelector(".zh").textContent=p.zh;lb.querySelector(".enl").textContent=p.en;
 lb.querySelector(".pv").disabled=cur===0;lb.querySelector(".nx").disabled=cur===P.length-1;
 const n=P[cur+1];if(n){const im=new Image();im.src="img/"+n.f+".jpg"}}
function open(i){if(lb)lb.remove();lb=document.createElement("div");lb.id="btlb";lb.setAttribute("role","dialog");lb.setAttribute("aria-modal","true");lb.setAttribute("aria-label","臺北實景照片 Taipei photos");
 lb.innerHTML=`<div class="top"><span class="ct"></span><button class="x" type="button" aria-label="關閉 Close">✕ 關閉</button></div><div class="fig"><img alt=""></div>
 <div class="cap"><div class="pl"></div><div class="zh"></div><div class="enl en"></div><div class="nav"><button class="pv" type="button" aria-label="上一張 Previous">◀ 上一張</button><button class="ls" type="button" aria-label="聽英文 Listen">🔊 聽英文</button><button class="nx" type="button" aria-label="下一張 Next">下一張 ▶</button></div></div>`;
 document.body.appendChild(lb);document.documentElement.style.overflow="hidden";
 lb.querySelector(".x").onclick=close;lb.querySelector(".pv").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}show(cur-1)};lb.querySelector(".nx").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}show(cur+1)};
 lb.querySelector(".ls").onclick=()=>talk(P[cur].en);
 lb.querySelector(".fig").onclick=e=>{if(e.target===e.currentTarget)close()};
 lb.addEventListener("touchstart",e=>{tx0=e.touches[0].clientX},{passive:true});
 lb.addEventListener("touchend",e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))},{passive:true});
 show(i);lb.querySelector(".x").focus()}
function close(){if(!lb)return;try{speechSynthesis.cancel()}catch(e){}lb.remove();lb=null;document.documentElement.style.overflow="";const b=document.querySelector(`[data-btp="${cur}"]`);if(b)b.focus()}
document.addEventListener("keydown",e=>{if(!lb)return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(cur-1);else if(e.key==="ArrowRight")show(cur+1)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-btp]");if(b){e.preventDefault();open(+b.dataset.btp);return}
 const q=e.target.closest("[data-btq]");if(q){const box=q.closest(".btp-q"),o=QZ.o[+q.dataset.btq],r=box.querySelector(".btp-r");
  box.querySelectorAll("[data-btq]").forEach(x=>x.classList.remove("ok","no"));q.classList.add(o[2]?"ok":"no");
  if(o[2]){r.innerHTML=`🎉 答對了！地熱谷的青磺泉微微綠色，像玉一樣。<br><span class="en">${H(QZ.ok)}</span>`;try{SFX.ok()}catch(x){}talk(QZ.ok);}
  else{r.innerHTML=`🤔 不是這個喔！再看看地熱谷的照片。<button type="button" data-btp="${VALLEY}">📷 看照片</button><br><span class="en">${H(QZ.no)}</span>`;talk(QZ.no)}}});
css.textContent+=`.btp-in{margin:10px 0 2px;text-align:left}.btp-in .t{font-size:13.5px;font-weight:900;margin:0 0 6px}.btp-in .t .en{font-weight:700;color:var(--muted);font-size:12.5px}
.btp-in .r{display:flex;gap:8px}.btp-in button{flex:1 1 0;min-width:0;border:0;padding:0;border-radius:12px;overflow:hidden;background:#DDE9F2;box-shadow:0 3px 0 var(--line)}
.btp-in img{display:block;width:100%;height:86px;object-fit:cover}`;
function addCard(){document.querySelectorAll(".lcard").forEach(c=>{if(c.querySelector(".btp-in"))return;const z=c.querySelector(".zhw");if(!z)return;const k=z.textContent.trim();
 const ix=P.map((p,i)=>p.k===k?i:-1).filter(i=>i>=0);if(!ix.length)return;const d=c.querySelector(".desc")||z;
 d.insertAdjacentHTML("afterend",`<div class="btp-in"><div class="t">📷 實景照片 <span class="en">Real photos — tap to see them big</span></div><div class="r">${ix.map(i=>`<button type="button" data-btp="${i}" aria-label="${H(P[i].pl)} ${H(P[i].pe)}，放大照片"><img src="img/t/${P[i].f}.jpg" alt="${H(P[i].zh)}" loading="lazy" decoding="async"></button>`).join("")}</div></div>`)})}
try{new MutationObserver(()=>{try{addCard()}catch(e){}}).observe(document.body,{childList:true,subtree:true})}catch(e){}
if(typeof showTopic==="function"){const st=showTopic;showTopic=function(){const r=st.apply(this,arguments);try{add()}catch(e){}return r}}
add();
})();</script>
